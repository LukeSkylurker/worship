  `;

  main.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.viewMode = btn.dataset.mode; renderAll(); });
  });
  main.querySelectorAll('.section-dup').forEach(btn=>{
    btn.addEventListener('click', ()=> duplicateSection(song, parseInt(btn.dataset.idx, 10)));
  });
  main.querySelectorAll('.section-close').forEach(btn=>{
    btn.addEventListener('click', ()=> removeSection(song.id, parseInt(btn.dataset.idx, 10)));
  });
  main.querySelectorAll('.section-trunc, .section-trunc-inline').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleTruncate(song.id, parseInt(btn.dataset.idx, 10)));
  });

  main.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('dragstart', e=>{
      dragSourceIdx = parseInt(handle.dataset.idx, 10);
      const card = handle.closest('.section-card');
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setDragImage(card, 20, 20);
      try{ e.dataTransfer.setData('text/plain', String(dragSourceIdx)); }catch(err){}
    });
    handle.addEventListener('dragend', ()=>{
      main.querySelectorAll('.section-card').forEach(c=>c.classList.remove('dragging','drag-over-top','drag-over-bottom'));
      dragSourceIdx = null;
    });
  });
  main.querySelectorAll('.section-card').forEach(card=>{
    card.addEventListener('dragover', e=>{
      if(dragSourceIdx===null) return;
      e.preventDefault();
      const targetIdx = parseInt(card.dataset.idx, 10);
      if(targetIdx===dragSourceIdx) return;
      const rect = card.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height/2;
      card.classList.toggle('drag-over-top', !after);
      card.classList.toggle('drag-over-bottom', after);
    });
    card.addEventListener('dragleave', ()=>{
      card.classList.remove('drag-over-top','drag-over-bottom');
    });
    card.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx = parseInt(card.dataset.idx, 10);
      const after = card.classList.contains('drag-over-bottom');
      card.classList.remove('drag-over-top','drag-over-bottom');
      if(dragSourceIdx===null || targetIdx===dragSourceIdx) return;
      reorderSection(song, dragSourceIdx, targetIdx, after);
    });
  });
  const undoBtn = document.getElementById('undoBtn');
  if(undoBtn) undoBtn.addEventListener('click', ()=> undoRemove(song.id));
  document.getElementById('pdfBtn').addEventListener('click', ()=>{
    const originalTitle = document.title;
    document.title = `${song.title} (${currentKey})`;
    const restore = ()=>{ document.title = originalTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 3000); // fallback for browsers that skip afterprint on "Save as PDF"
  });
  document.getElementById('presentBtn').addEventListener('click', ()=>{
    if(getPresentableSetSongs().length > 1) openSetPresentPrompt();
    else enterFocusMode(false);
  });
  document.getElementById('keySelect').addEventListener('change', e=>{
    state.keyBySong[song.id] = e.target.value; renderAll();
  });
  document.getElementById('keyUp').addEventListener('click', ()=>{
    const i = ALL_KEYS.indexOf(currentKey);
    state.keyBySong[song.id] = ALL_KEYS[(i+1)%ALL_KEYS.length]; renderAll();
  });
  document.getElementById('keyDown').addEventListener('click', ()=>{
    const i = ALL_KEYS.indexOf(currentKey);
    state.keyBySong[song.id] = ALL_KEYS[(i-1+ALL_KEYS.length)%ALL_KEYS.length]; renderAll();
  });
  const resetBtn = document.getElementById('keyReset');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    delete state.keyBySong[song.id]; renderAll();
  });
  document.getElementById('chordSizeUp').addEventListener('click', ()=>{
    state.chordScale = Math.min(CHORD_SCALE_MAX, +(state.chordScale + CHORD_SCALE_STEP).toFixed(2));
    applyChordScale(); renderAll();
  });
  document.getElementById('chordSizeDown').addEventListener('click', ()=>{
    state.chordScale = Math.max(CHORD_SCALE_MIN, +(state.chordScale - CHORD_SCALE_STEP).toFixed(2));
    applyChordScale(); renderAll();
  });
  const chordSizeResetBtn = document.getElementById('chordSizeReset');
  if(chordSizeResetBtn) chordSizeResetBtn.addEventListener('click', ()=>{
    state.chordScale = 1; applyChordScale(); renderAll();
  });
  main.querySelectorAll('.nav-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.getElementById(el.dataset.target).scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// Distraction-free chart view used while presenting: hides everything but
// the section cards, highlights + auto-scrolls to the section in focus, and
// (via syncPresentToFocus) mirrors that section to the projector window.
// A section too long for one projected slide gets rendered here as its own
// chart card per part — same chunk-splitting boundaries as buildSlideGroups
// uses for the projector, so what's on screen always matches what the chart
// shows. Chord summary lines (chordLine/chordLine2) only repeat on part 1.
function renderFocusPartialCard(section, sectionIdx, steps, useFlats, position, focused){
  const meta = sectionMeta(section);
  const focusedCls = focused ? ' focused' : '';
  const partSuffix = position.parts > 1
    ? ` <span class="section-part">(${position.part}/${position.parts})</span>`
    : '';

  let body = '';
  if(position.part === 1){
    if(section.chordLine){
      body += `<div class="chord-line">${section.chordLine.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
    }
    if(section.chordLine2){
      body += `<div class="chord-line" style="margin-top:8px;">${section.chordLine2.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
    }
  }
  const [start, end] = position.range;
  body += section.lines.slice(start, end)
    .map(line=>`<div class="lyric-line">${line.map(ch=>renderChunk(ch, steps, useFlats)).join('')}</div>`)
    .join('');

  return `<div class="section-card${focusedCls}" id="sec-${sectionIdx}-p${position.part}" style="--badge-color:${meta.color}">
    <div class="section-card-head">
      <span class="badge">${meta.abbr}</span>
      <span class="section-label">${meta.label}${partSuffix}</span>
    </div>
    ${body}
  </div>`;
}

// Marks where one song ends and the next begins in a whole-set presentation
// — the "next song" the request asks to see flagged in the continuous scroll.
function renderSetSongDivider(song, isFirst){
  return `<div class="set-song-divider${isFirst ? ' first' : ''}">
    <span class="set-song-divider-label">${isFirst ? 'Now Presenting' : 'Next Song'}</span>
    <span class="set-song-divider-title">${esc(song.title)}</span>
    <span class="set-song-divider-artist">${esc(song.artist)}</span>
  </div>`;
}

function renderFocusView(){
  const main = document.getElementById('main');
  const ctx = getFocusPositions();
  const { positions } = ctx;

  if(!positions.length){
    const fallbackTitle = state.presentingSet ? "This Week's Set" : (ctx.songs[0] ? ctx.songs[0].title : '');
    main.innerHTML = `
      <div class="focus-bar">
        <button class="focus-exit" id="focusExit">&times; Exit Focus</button>
        <div class="focus-title">${esc(fallbackTitle)}</div>
        <div class="focus-counter"></div>
      </div>
      <div class="empty-state"><h3>Nothing to focus on</h3><p>Every section has been removed from this chart.</p></div>`;
    document.getElementById('focusExit').addEventListener('click', exitFocusMode);
    return;
  }

  state.focusPos = Math.max(0, Math.min(positions.length - 1, state.focusPos));
  const focusedPos = positions[state.focusPos];
  const focusedSong = SONGS.find(s=>s.id===focusedPos.songId);
  // Keep currentId following the focused position while presenting the
  // whole set, so exiting focus mode mid-set lands the normal chart view on
  // whichever song was actually in view, not wherever "Present" was clicked.
  if(state.presentingSet) state.currentId = focusedPos.songId;

  let lastSongId = null;
  const cards = positions.map((pos, i)=>{
    const song = SONGS.find(s=>s.id===pos.songId);
    const currentKey = state.keyBySong[song.id] || song.originalKey;
    const steps = stepsBetween(song.originalKey, currentKey);
    const useFlats = FLAT_KEYS.has(currentKey);
    const focused = i === state.focusPos;

    let divider = '';
    if(state.presentingSet && song.id !== lastSongId){
      divider = renderSetSongDivider(song, i === 0);
      lastSongId = song.id;
    }

    const section = song.sections[pos.sectionIdx];
    // pos.slotId (not pos.sectionIdx) is the id passed through for the card's
    // DOM anchor -- a duplicated section shares its sectionIdx (content) with
    // its source but has its own distinct slotId, so the two occurrences
    // don't collide on the same "sec-N" element id here.
    const card = pos.range === null
      ? renderSection(section, pos.slotId, steps, useFlats, null, focused)
      : renderFocusPartialCard(section, pos.slotId, steps, useFlats, pos, focused);
    return divider + card;
  }).join('');

  const songIdxInSet = state.presentingSet ? ctx.songs.findIndex(s=>s.id===focusedPos.songId) : -1;
  const counterText = songIdxInSet > -1
    ? `${state.focusPos + 1} / ${positions.length} &middot; Song ${songIdxInSet + 1}/${ctx.songs.length}`
    : `${state.focusPos + 1} / ${positions.length}`;

  main.innerHTML = `
    <div class="focus-bar">
      <button class="focus-exit" id="focusExit" title="Exit focus mode (Esc)">&times; Exit Focus</button>
      <div class="focus-title">${esc(focusedSong.title)}</div>
      <div class="focus-counter">${counterText}</div>
    </div>
    <div class="chart-grid focus-mode-grid${state.viewMode==='lyrics' ? ' hide-chords' : ''}" id="focusGrid">${cards}</div>
    <div class="focus-nav">
      <button class="focus-nav-btn" id="focusUp" title="Previous section (↑)" ${state.focusPos===0 ? 'disabled' : ''}>&uarr;</button>
      <button class="focus-nav-btn" id="focusDown" title="Next section (↓)" ${state.focusPos===positions.length-1 ? 'disabled' : ''}>&darr;</button>
    </div>
  `;

  document.getElementById('focusExit').addEventListener('click', exitFocusMode);
  document.getElementById('focusUp').addEventListener('click', ()=> focusMove(-1));
  document.getElementById('focusDown').addEventListener('click', ()=> focusMove(1));

  // Let the user "break into" the song by clicking any card directly —
  // jumps focus straight to that section/part instead of only stepping
  // one at a time, then proceeds through the normal focus mechanics
  // (highlight, scroll, projector sync) from there.
  document.querySelectorAll('#focusGrid > .section-card').forEach((card, i)=>{
    card.addEventListener('click', ()=>{
      if(i === state.focusPos) return;
      state.focusPos = i;
      renderFocusView();
    });
  });

  const focusedCard = main.querySelector('.section-card.focused');
  if(focusedCard && typeof focusedCard.scrollIntoView === 'function'){
    try{ focusedCard.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
  }

  syncPresentToFocus();
}

function renderAll(){
  renderSongList();
  renderMain();
  syncUrlFromState();
}

/* ======================= PROJECTION SLIDES ======================= */

const MAX_LINES_PER_SLIDE = 4;
const slideState = { slides: [], index: 0 };

// Joins a line's chunks into plain lyric text for projection (no chords).
// A chunk ending in a bare hyphen (e.g. "eve-") is a mid-word split and
// gets glued to the next chunk with no space; "hal - le -" style spelled
// syllables (hyphen preceded by a space) join normally with a space.
function joinLineText(line){
  let out = '';
  for(const ch of line){
    const t = ch.l || '';
    if(!t) continue;
    if(/[^\s]-$/.test(out)){
      out = out.slice(0, -1) + t;
    } else if(out){
      out += ' ' + t;
    } else {
      out = t;
    }
  }
  return out;
}

// Splits `total` lines into the fewest slides that each hold at most
// `maxPerSlide`, but — unlike a greedy fill — spreads the remainder across
// the early slides so no split leaves a lopsided, mostly-empty last slide
// (10 lines / max 4 => [4,3,3], not [4,4,2]).
function computeSplitRanges(total, maxPerSlide){
  if(total <= 0) return [[0, 0]];
  if(total <= maxPerSlide) return [[0, total]];
  const numSlides = Math.ceil(total / maxPerSlide);
  const base = Math.floor(total / numSlides);
  const remainder = total % numSlides;
  const ranges = [];
  let start = 0;
  for(let i=0; i<numSlides; i++){
    const size = base + (i < remainder ? 1 : 0);
    ranges.push([start, start + size]);
    start += size;
  }
  return ranges;
}

// Builds one slide-group per *visible* section (custom order + removed
// sections applied), ignoring Minimal/Lyrics view settings — a live
// projection needs every repeat shown, chords stripped. A section with no
// lyrics (an intro, an instrumental break) still gets one blank slide, and a
// section too long for one slide splits into evenly-sized parts — either
// way every slide traces back to exactly one group. That 1:1 mapping (via
// flattenFocusPositions) is what lets chart-focus navigation and the
// projector step through the same sequence in lockstep.
// Walks the same visible-slot sequence renderMain uses (custom order,
// removed sections, and any duplicated sections all applied), so a
// duplicated section shows up as its own real slide(s) here too — a
// duplicate slot resolves through getSectionIdx to the same content as its
// source, but keeps its own distinct slotId so its slide(s) and focus-mode
// card are their own independently-navigable entry, not a rerun of the
// source's.
function buildSlideGroups(song){
  const removedStack = state.removedBySong[song.id] || [];
  const order = getOrder(song);
  const visible = order.filter(i => !removedStack.includes(i));
  const groups = [];
  let cursor = 0;
  visible.forEach(slotId=>{
    const idx = getSectionIdx(song, slotId);
    const sec = song.sections[idx];
    const label = sectionMeta(sec).label;
    const totalLines = sec.lines ? sec.lines.length : 0;

    if(!totalLines){
      groups.push({ sectionIdx: idx, slotId, label, startIndex: cursor, count: 1, ranges: null, slides: [{ label, lines: [] }] });
      cursor += 1;
      return;
    }

    const ranges = computeSplitRanges(totalLines, MAX_LINES_PER_SLIDE);
    const slides = ranges.map(([start, end], i)=>{
      const textLines = sec.lines.slice(start, end).map(joinLineText).filter(Boolean);
      const partLabel = ranges.length > 1 ? `${label} (${i+1}/${ranges.length})` : label;
      return { label: partLabel, lines: textLines };
    });
    groups.push({ sectionIdx: idx, slotId, label, startIndex: cursor, count: slides.length, ranges, slides });
    cursor += slides.length;
  });
  return groups;
}

function buildSlides(song){
  return buildSlideGroups(song).reduce((acc, g)=> acc.concat(g.slides), []);
}

// Flattens slide-groups into one entry per actual slide — the same order
// and length as buildSlides()'s output — so state.focusPos can index this
// array directly and always mean "the same slide the projector is showing."
function flattenFocusPositions(groups){
  const positions = [];
  groups.forEach(g=>{
    if(!g.ranges){
      positions.push({ sectionIdx: g.sectionIdx, slotId: g.slotId, label: g.label, range: null, part: 1, parts: 1 });
    } else {
      g.ranges.forEach((range, i)=>{
        positions.push({ sectionIdx: g.sectionIdx, slotId: g.slotId, label: g.label, range, part: i + 1, parts: g.ranges.length });
      });
    }
  });
  return positions;
}

/* ---- Presenting "This Week's Set" as one continuous run ---- */

// Songs in the set, in set order, that actually have a chart to present.
function getPresentableSetSongs(){
  return state.setList
    .map(id=>SONGS.find(s=>s.id===id))
    .filter(s=> s && !s.pending && s.sections && s.sections.length);
}

// Concatenates every presentable set song's slides/positions into one
// continuous run, each position tagged with the song it belongs to. This is
// what lets focusMove() cross from the last section of one song straight
// into the first section of the next with no special-case boundary logic —
// it's all just one long list, same as a single song's own positions.
function buildSetPresentation(){
  const songs = getPresentableSetSongs();
  const slides = [];
  const positions = [];
  songs.forEach(song=>{
    const groups = buildSlideGroups(song);
    const localSlides = groups.reduce((acc, g)=> acc.concat(g.slides), []);
    flattenFocusPositions(groups).forEach((pos, i)=>{
      positions.push({ ...pos, songId: song.id });
      slides.push({ songTitle: song.title, label: localSlides[i].label, lines: localSlides[i].lines });
    });
  });
  return { songs, slides, positions };
}

// Unified context for whatever's currently being focused/presented — either
// one song's own positions/slides, or (when state.presentingSet) the whole
// set's concatenated run. Everything downstream (rendering, navigation,
// projector sync) reads from this instead of caring which mode it's in.
// Every slide carries its own songTitle (even outside a set presentation)
// so the projector can always show which song is playing.
function getFocusPositions(){
  if(state.presentingSet) return buildSetPresentation();
  const song = SONGS.find(s=>s.id===state.currentId);
  if(!song || song.pending) return { songs: [], slides: [], positions: [] };
  const groups = buildSlideGroups(song);
  const positions = flattenFocusPositions(groups).map(p=>({ ...p, songId: song.id }));
  const slides = groups.reduce((acc, g)=> acc.concat(g.slides), [])
    .map(s=>({ songTitle: song.title, label: s.label, lines: s.lines }));
  return { songs: [song], slides, positions };
}

function renderSlide(){
  const { slides, index } = slideState;
  const songEl = document.getElementById('slideSong');
  const labelEl = document.getElementById('slideLabel');
  const textEl = document.getElementById('slideText');
  const counterEl = document.getElementById('slideCounter');
  if(!slides.length){
    songEl.textContent = '';
    labelEl.textContent = '';
    textEl.textContent = "No lyrics to project for this song yet.";
    counterEl.textContent = '';
    return;
  }
  const s = slides[index];
  songEl.textContent = s.songTitle || '';
  labelEl.textContent = s.label;
  textEl.innerHTML = s.lines.map(esc).join('<br>');
  counterEl.textContent = `${index + 1} / ${slides.length}`;
}

function slideNext(){ if(slideState.index < slideState.slides.length - 1){ slideState.index++; renderSlide(); } }
function slidePrev(){ if(slideState.index > 0){ slideState.index--; renderSlide(); } }

function onSlideKeydown(e){
  if(e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' '){ e.preventDefault(); slideNext(); }
  else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); slidePrev(); }
  else if(e.key==='Escape'){ closeSlides(); }
}

function openSlides(){
  slideState.slides = getFocusPositions().slides;
  slideState.index = state.focusPos || 0;
  renderSlide();
  document.getElementById('slidesOverlay').hidden = false;
  document.addEventListener('keydown', onSlideKeydown);
}
function closeSlides(){
  document.getElementById('slidesOverlay').hidden = true;
  document.removeEventListener('keydown', onSlideKeydown);
}

/* ---- Separate-window presentation (draggable to a second display) ---- */
// A plain in-page overlay can never leave the browser tab, so true "drag
// this onto my second monitor" needs a real OS-level window: window.open()
// gives the operator something with its own title bar they can drag to
// another display and fullscreen there, independent of this tab.

let presentWin = null;
let presentPollTimer = null;

function buildPresentHTML(songTitle, slides){
  const json = JSON.stringify(slides).replace(/</g, '\\u003c');
  return `<!doctype html>
<title>Presenting: ${songTitle.replace(/</g,'&lt;')}</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#0a0a0a; color:#f5f3ec; font-family:Georgia,'Times New Roman',serif;}
  body{display:flex; align-items:center; justify-content:center; flex-direction:column; padding:8vh 9vw; text-align:center; user-select:none; touch-action:none; overflow:hidden;}
  .p-song{position:fixed; top:22px; left:28px; font-family:monospace; font-size:.95rem; letter-spacing:.05em; text-transform:uppercase; color:rgba(245,243,236,.65);}
  .p-label{position:fixed; top:50px; left:28px; font-family:monospace; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:rgba(245,243,236,.4);}
  .p-text{font-weight:600; font-size:clamp(1.8rem, 5vw, 4.2rem); line-height:1.35; max-width:100%;}
  .p-counter{position:fixed; bottom:22px; right:28px; font-family:monospace; font-size:.75rem; color:rgba(245,243,236,.4);}
  .p-nav{position:fixed; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; background:rgba(245,243,236,.08); color:#f5f3ec; font-size:1.7rem; display:flex; align-items:center; justify-content:center;}
  .p-nav:hover{background:rgba(245,243,236,.18);}
  .p-prev{left:18px;} .p-next{right:18px;}
  .p-fs{position:fixed; top:18px; right:22px; background:none; border:none; cursor:pointer; color:rgba(245,243,236,.55); font-size:.85rem; font-family:monospace; padding:6px;}
  .p-fs:hover{color:#f5f3ec;}
</style>
<div class="p-song" id="song"></div>
<div class="p-label" id="label"></div>
<div class="p-text" id="text"></div>
<div class="p-counter" id="counter"></div>
<button class="p-nav p-prev" id="prev" aria-label="Previous">&lsaquo;</button>
<button class="p-nav p-next" id="next" aria-label="Next">&rsaquo;</button>
<button class="p-fs" id="fs">Fullscreen (F)</button>
<script>
  var SLIDES = ${json};
  var i = 0;
  function render(){
    var songEl = document.getElementById('song');
    var labelEl = document.getElementById('label');
    var textEl = document.getElementById('text');
    var counterEl = document.getElementById('counter');
    if(!SLIDES.length){
      textEl.textContent = 'No lyrics to project for this song yet.';
      songEl.textContent = ''; labelEl.textContent = ''; counterEl.textContent = '';
      return;
    }
    var s = SLIDES[i];
    songEl.textContent = s.songTitle || '';
    labelEl.textContent = s.label;
    textEl.innerHTML = s.lines.map(function(l){
      var d = document.createElement('div'); d.textContent = l; return d.innerHTML;
    }).join('<br>');
    counterEl.textContent = (i + 1) + ' / ' + SLIDES.length;
    if(window.opener){ try{ window.opener.postMessage({type:'worship-present-state', index:i, total:SLIDES.length}, '*'); }catch(e){} }
  }
  function next(){ if(i < SLIDES.length - 1){ i++; render(); } }
  function prev(){ if(i > 0){ i--; render(); } }
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('fs').addEventListener('click', function(){
    try{
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else{ document.documentElement.requestFullscreen(); }
    }catch(e){}
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' '){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='f' || e.key==='F'){ document.getElementById('fs').click(); }
  });
  var sx = null, sy = null;
  document.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(sx===null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0) next(); else prev(); }
  }, {passive:true});
  window.addEventListener('message', function(e){
    if(!e.data) return;
    if(e.data.type==='worship-present-nav'){
      if(e.data.dir==='next') next();
      else if(e.data.dir==='prev') prev();
    } else if(e.data.type==='worship-present-goto'){
      var idx = e.data.index;
      if(typeof idx === 'number' && idx >= 0 && idx < SLIDES.length && idx !== i){ i = idx; render(); }
    }
  });
  render();
<\/script>`;
}

function showPresentBar(total){
  document.getElementById('presentBar').hidden = false;
  document.getElementById('presentBarCounter').textContent = `1 / ${total}`;
}
function hidePresentBar(){
  document.getElementById('presentBar').hidden = true;
}

function openPresentWindow(){
  const ctx = getFocusPositions();
  const title = state.presentingSet ? "This Week's Set" : (ctx.songs[0] ? ctx.songs[0].title : 'Presentation');
  if(presentPollTimer){ clearInterval(presentPollTimer); presentPollTimer = null; }
  const w = window.open('', 'worshipPresentDisplay', 'width=1000,height=700,resizable=yes,menubar=no,toolbar=no,location=no,status=no');
  if(!w){
    // Popup blocked — fall back to the in-tab overlay so Present still works.
    openSlides();
    return;
  }
  presentWin = w;
  presentWin.document.open();
  presentWin.document.write(buildPresentHTML(title, ctx.slides));
  presentWin.document.close();
  try{ presentWin.focus(); }catch(e){}
  showPresentBar(ctx.slides.length);
  presentPollTimer = setInterval(()=>{
    if(!presentWin || presentWin.closed){
      hidePresentBar();
      if(presentPollTimer){ clearInterval(presentPollTimer); presentPollTimer = null; }
      presentWin = null;
      if(state.focusMode) exitFocusMode();
    }
  }, 800);
}

/* ---- Chart focus mode: navigate sections on the chart, mirrored live to the projector ---- */

function onFocusKeydown(e){
  if(!state.focusMode) return;
  // Focus mode owns arrow/space/escape while active — stop the fallback
  // slides-overlay's own keydown handler (bound to the same document) from
  // also reacting and fighting over the same slide index.
  e.stopImmediatePropagation();
  if(e.key==='ArrowDown' || e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); focusMove(1); }
  else if(e.key==='ArrowUp' || e.key==='ArrowLeft'){ e.preventDefault(); focusMove(-1); }
  else if(e.key==='Escape'){ exitFocusMode(); }
}

function openSetPresentPrompt(){
  const songs = getPresentableSetSongs();
  document.getElementById('setPresentModalText').innerHTML =
    `This week's set has <strong>${songs.length} songs</strong>. Presenting the whole set moves straight from one song into the next, in order, without ever leaving Present Mode.`;
  document.getElementById('setPresentModal').hidden = false;
}
function closeSetPresentPrompt(){
  document.getElementById('setPresentModal').hidden = true;
}

// presentSet:true starts a single continuous run through every presentable
// song in "This Week's Set" (from the top), rather than just the current
// song — see buildSetPresentation()/getFocusPositions() for how the whole
// set becomes one flat, seamlessly-navigable sequence.
function enterFocusMode(presentSet){
  state.presentingSet = !!presentSet;
  if(state.presentingSet){
    const songs = getPresentableSetSongs();
    if(!songs.length){ state.presentingSet = false; return; }
    state.currentId = songs[0].id;
  }
  state.focusMode = true;
  state.focusPos = 0;
  document.addEventListener('keydown', onFocusKeydown);
  openPresentWindow();
  renderAll();
}

function exitFocusMode(){
  state.focusMode = false;
  state.presentingSet = false;
  document.removeEventListener('keydown', onFocusKeydown);
  renderAll();
}

function focusMove(delta){
  const positions = getFocusPositions().positions;
  if(!positions.length) return;
  state.focusPos = Math.max(0, Math.min(positions.length - 1, state.focusPos + delta));
  renderAll();
}

// Tells the projector (popup, or the in-tab fallback overlay) to jump to the
// slide in focus. state.focusPos indexes the same flattened slide list
// getFocusPositions() produces (one song's, or the whole set's), so no
// section-to-slide lookup is needed — the chart position IS the slide index.
function syncPresentToFocus(){
  if(!state.focusMode) return;
  if(presentWin && !presentWin.closed){
    try{ presentWin.postMessage({type:'worship-present-goto', index: state.focusPos}, '*'); }catch(e){}
  } else if(!document.getElementById('slidesOverlay').hidden){
    slideState.slides = getFocusPositions().slides;
    slideState.index = state.focusPos;
    renderSlide();
  }
}

// Vertical swipe on the chart itself moves focus by one section (up = prior,
// down = next) — same gesture direction as the existing slide-swipe.
let focusTouchStartX = null, focusTouchStartY = null;
document.addEventListener('touchstart', e=>{
  if(!state.focusMode) return;
  const t = e.changedTouches[0];
  focusTouchStartX = t.clientX; focusTouchStartY = t.clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(!state.focusMode || focusTouchStartX===null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - focusTouchStartX;
  const dy = t.clientY - focusTouchStartY;
  focusTouchStartX = null;
  if(Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) * 1.5){
    if(dy < 0) focusMove(1); else focusMove(-1);
  }
}, {passive:true});

(function initSetPresentModal(){
  const modal = document.getElementById('setPresentModal');
  document.getElementById('setPresentWholeSet').addEventListener('click', ()=>{
    closeSetPresentPrompt();
    enterFocusMode(true);
  });
  document.getElementById('setPresentJustSong').addEventListener('click', ()=>{
    closeSetPresentPrompt();
    enterFocusMode(false);
  });
  modal.addEventListener('click', e=>{ if(e.target === modal) closeSetPresentPrompt(); });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && !modal.hidden) closeSetPresentPrompt();
  });
})();

(function initSlidesOverlay(){
  const overlay = document.getElementById('slidesOverlay');
  document.getElementById('slideNext').addEventListener('click', slideNext);
  document.getElementById('slidePrev').addEventListener('click', slidePrev);
  document.getElementById('slideClose').addEventListener('click', closeSlides);
  document.getElementById('presentBarPrev').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.postMessage({type:'worship-present-nav', dir:'prev'}, '*');
  });
  document.getElementById('presentBarNext').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.postMessage({type:'worship-present-nav', dir:'next'}, '*');
  });
  document.getElementById('presentBarClose').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.close();
    hidePresentBar();
    if(state.focusMode) exitFocusMode();
  });
  window.addEventListener('message', e=>{
    if(e.data && e.data.type==='worship-present-state'){
      document.getElementById('presentBarCounter').textContent = `${e.data.index + 1} / ${e.data.total}`;
      // Mirror the projector's own navigation (its arrow keys/swipe) back onto
      // the chart — focusPos and the projector's slide index are the same
      // number now, so this is a direct assignment, not a lookup.
      if(state.focusMode && e.data.index !== state.focusPos){
        const song = SONGS.find(s=>s.id===state.currentId);
        if(song && !song.pending){
          state.focusPos = e.data.index;
          renderAll();
        }
      }
    }
  });
  let touchStartX = null, touchStartY = null;
  overlay.addEventListener('touchstart', e=>{
    if(state.focusMode) return; // chart focus mode owns swipe navigation instead
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  overlay.addEventListener('touchend', e=>{
    if(state.focusMode || touchStartX===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) slideNext(); else slidePrev();
    }
  }, {passive:true});
})();

(function initLayoutToggle(){
  const wrap = document.getElementById('layoutToggle');
  if(!wrap) return;
  wrap.addEventListener('click', e=>{
    const btn = e.target.closest('.layout-btn');
    if(!btn) return;
    state.layout = btn.dataset.layout;
    applyLayout();
  });
})();

function applyLayout(){
  const app = document.querySelector('.app');
  if(app) app.classList.toggle('layout-1col', state.layout === '1col');
  document.querySelectorAll('#layoutToggle .layout-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.layout === state.layout);
  });
}

// Pushes the current chord-size preference out as a CSS custom property on
// .app, so every chord-size rule (chart view, 1col, focus/present mode,
// print) picks it up through the calc(...* var(--chord-scale,1)) rules
// above without each needing its own JS-driven size logic.
function applyChordScale(){
  const app = document.querySelector('.app');
  if(app) app.style.setProperty('--chord-scale', state.chordScale);
}

loadSetFromLocation();
applyLayout();
applyChordScale();
renderAll();
</script>
