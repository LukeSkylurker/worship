<!doctype html>
<title>Sunday Set Charts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#EEEAE0;
    --surface:#FFFFFF;
    --surface-2:#F6F2E8;
    --ink:#22252A;
    --ink-dim:#5C5F66;
    --ink-faint:#8C8F94;
    --border:#DFDACA;
    --border-soft:#E9E4D5;
    --accent:#AD7A34;
    --accent-strong:#8C5F22;
    --chord:#8C5F22;
    --sec-intro:#3F7D74;
    --sec-verse:#4C5A93;
    --sec-chorus:#AD7A34;
    --sec-bridge:#9C4B5A;
    --sec-inst:#6B6F76;
    --sec-break:#6B3F5C;
    --sec-tag:#3F7D74;
    --sec-outro:#6B6F76;
    --shadow: 0 1px 2px rgba(30,25,15,.07), 0 6px 18px rgba(30,25,15,.06);
    --chord-scale: 1;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181C;
      --surface:#1F2126;
      --surface-2:#1A1C21;
      --ink:#EEEBE3;
      --ink-dim:#A8ABB1;
      --ink-faint:#787B81;
      --border:#34373E;
      --border-soft:#2A2D33;
      --accent:#D7A95D;
      --accent-strong:#E8BD79;
      --chord:#E8BD79;
      --sec-intro:#62AB9F;
      --sec-verse:#8391D6;
      --sec-chorus:#D7A95D;
      --sec-bridge:#CC7C95;
      --sec-inst:#9DA1A9;
      --sec-break:#A96FA4;
      --sec-tag:#62AB9F;
      --sec-outro:#9DA1A9;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181C;
    --surface:#1F2126;
    --surface-2:#1A1C21;
    --ink:#EEEBE3;
    --ink-dim:#A8ABB1;
    --ink-faint:#787B81;
    --border:#34373E;
    --border-soft:#2A2D33;
    --accent:#D7A95D;
    --accent-strong:#E8BD79;
    --chord:#E8BD79;
    --sec-intro:#62AB9F;
    --sec-verse:#8391D6;
    --sec-chorus:#D7A95D;
    --sec-bridge:#CC7C95;
    --sec-inst:#9DA1A9;
    --sec-break:#A96FA4;
    --sec-tag:#62AB9F;
    --sec-outro:#9DA1A9;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance;}

  .app{display:flex; min-height:100vh; max-width:1400px; margin:0 auto;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:290px; flex-shrink:0;
    background:var(--surface-2);
    border-right:1px solid var(--border-soft);
    padding:26px 18px 40px;
    overflow-y:auto;
  }
  .brand{padding:2px 8px 20px;}
  .brand .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase; color:var(--accent-strong);
  }
  .brand h1{font-size:1.5rem; font-weight:600; margin:.2em 0 0; color:var(--ink); line-height:1.15;}
  .brand p{margin:.35em 0 0; font-size:.82rem; color:var(--ink-dim);}

  .song-section-head{
    display:flex; align-items:center; justify-content:flex-start; gap:10px;
    margin:20px 0 8px; padding:0 2px;
  }
  .song-section:first-child .song-section-head{margin-top:2px;}
  .song-section-title{
    font-family:'IBM Plex Mono', monospace; font-size:.7rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);
  }
  .share-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    padding:4px 10px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-dim); cursor:pointer;
  }
  .share-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .share-btn.copied{border-color:var(--accent); color:var(--accent-strong); background:var(--surface-2);}
  .reveal-all-btn{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:.76rem; font-weight:600;
    padding:9px 10px; border-radius:10px; border:1px dashed var(--border);
    background:transparent; color:var(--ink-dim); cursor:pointer; text-align:center;
  }
  .reveal-all-btn:hover{border-color:var(--accent); color:var(--accent-strong); border-style:solid;}
  .hide-all-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    padding:4px 10px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-dim); cursor:pointer;
  }
  .hide-all-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .set-empty{
    font-size:.78rem; color:var(--ink-faint); line-height:1.5; margin:0; padding:0 2px 4px;
  }

  .song-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px;}
  .song-item{
    position:relative;
    display:flex; align-items:center; gap:10px;
    padding:9px 34px 9px 10px; border-radius:10px; cursor:pointer;
    border:1px solid transparent;
  }
  .song-item:hover{background:var(--surface);}
  .song-item.active{background:var(--surface); border-color:var(--border); box-shadow:var(--shadow);}
  .song-num{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--ink-faint);
    width:1.4em; flex-shrink:0; text-align:right;
  }
  .song-item.active .song-num{color:var(--accent-strong); font-weight:600;}
  .song-meta{flex:1; min-width:0;}
  .song-title{font-size:.87rem; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-artist{font-size:.74rem; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-key-pill{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    color:var(--ink-dim); border:1px solid var(--border); border-radius:6px;
    padding:2px 6px; flex-shrink:0;
  }
  .song-item.pending .song-title{color:var(--ink-faint); font-weight:500;}
  .song-key-pill.empty{color:var(--ink-faint); border-style:dashed;}

  .set-add-btn, .set-remove-btn{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px; border-radius:6px; flex-shrink:0;
    font-size:.8rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .set-add-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-dim);
  }
  .set-add-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .set-add-btn.added{background:var(--accent); border-color:var(--accent); color:#fff; cursor:default;}
  .set-remove-btn{
    border:1px solid transparent; background:transparent; color:var(--ink-faint);
  }
  .set-remove-btn:hover{background:var(--surface-2); border-color:var(--border); color:#B23B3B;}
  .set-item .drag-handle{margin-right:-2px;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:34px 44px 80px; overflow-y:auto;}

  .chart-header{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:20px;}
  .chart-header h2{font-size:2.1rem; font-weight:600; margin:0; color:var(--ink); line-height:1.1;}
  .chart-header .artist{margin:.3em 0 0; font-size:1rem; color:var(--ink-dim); font-style:italic; font-family:'Fraunces', serif;}

  .meta-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .meta-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:500; color:var(--ink-dim);
    border:1px solid var(--border); border-radius:7px; padding:5px 9px; background:var(--surface);
  }
  .view-toggle{
    display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .toggle-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:600;
    padding:7px 13px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .toggle-btn:not(:last-child){border-right:1px solid var(--border);}
  .toggle-btn.active{background:var(--accent); color:#fff;}
  .toggle-btn:hover:not(.active){color:var(--ink);}

  .chart-grid.hide-chords .section-card.chord-only{display:none;}
  .chart-grid.hide-chords .chord-line{display:none;}
  .chart-grid.hide-chords .chunk .chord{display:none;}
  .chart-grid.hide-chords .chunk{gap:0;}
  .section-nav.hide-chords .nav-pill.chord-only{display:none;}

  .key-control{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:6px 8px 6px 14px; box-shadow:var(--shadow);
  }
  .key-control label{font-size:.72rem; font-weight:600; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;}
  .key-control select{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.95rem;
    color:var(--ink); background:transparent; border:none; padding:2px 4px; cursor:pointer;
  }
  .step-btn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); font-size:.95rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .step-btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-strong);}
  .step-btn:disabled{opacity:.35; cursor:default;}
  .reset-link{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; color:var(--accent-strong);
    background:none; border:none; cursor:pointer; text-decoration:underline; padding:0 2px;
  }

  .pdf-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:600;
    color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:8px 13px; cursor:pointer; box-shadow:var(--shadow);
  }
  .pdf-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .pdf-btn svg{width:13px; height:13px; flex-shrink:0;}

  .print-only{display:none;}

  .section-nav{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0 26px;}
  .nav-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 11px 4px 5px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:.71rem; font-weight:600;
  }
  .nav-pill:hover{border-color:var(--pill-color, var(--accent));}
  .nav-dot{
    width:17px; height:17px; border-radius:50%; border:2px solid var(--pill-color, var(--accent));
    color:var(--pill-color, var(--accent)); display:flex; align-items:center; justify-content:center;
    font-size:.58rem; font-weight:700; flex-shrink:0;
  }

  .chart-grid{columns: 2 400px; column-gap:18px;}
  .section-card{
    break-inside:avoid; display:block;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px 20px; margin:0 0 18px; box-shadow:var(--shadow); scroll-margin-top:20px;
    transition:opacity .15s, box-shadow .1s;
  }
  .section-card.dragging{opacity:.35;}
  .section-card.drag-over-top{box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow);}
  .section-card.drag-over-bottom{box-shadow: inset 0 -3px 0 0 var(--accent), var(--shadow);}
  .section-card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .drag-handle{
    cursor:grab; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; flex-shrink:0; margin-right:-2px;
  }
  .drag-handle:hover{color:var(--ink-dim);}
  .drag-handle:active{cursor:grabbing;}
  .drag-handle svg{width:11px; height:16px;}
  .badge{
    width:32px; height:32px; border-radius:50%; border:2px solid var(--badge-color, var(--accent));
    color:var(--badge-color, var(--accent)); display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:.72rem; flex-shrink:0;
  }
  .section-label{font-weight:700; font-size:.83rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink);}
  .head-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .section-note{font-size:.72rem; font-style:italic; color:var(--ink-faint); white-space:nowrap;}
  .section-close{
    width:22px; height:22px; border-radius:6px; border:1px solid transparent; flex-shrink:0;
    background:transparent; color:var(--ink-faint); font-size:.78rem; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .section-close:hover{background:var(--surface-2); border-color:var(--border); color:#B23B3B;}
  .section-dup{
    width:22px; height:22px; border-radius:6px; border:1px solid transparent; flex-shrink:0;
    background:transparent; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .section-dup svg{width:13px; height:13px;}
  .section-dup:hover{background:var(--surface-2); border-color:var(--border); color:var(--accent);}
  .dup-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-style:italic;
    color:var(--ink-faint);
  }
  .section-trunc{
    width:22px; height:22px; border-radius:6px; border:1px solid transparent; flex-shrink:0;
    background:transparent; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .section-trunc svg{width:13px; height:13px;}
  .section-trunc:hover{background:var(--surface-2); border-color:var(--border); color:var(--accent);}
  .section-trunc.active{color:var(--accent);}
  .trunc-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-style:italic;
    color:var(--ink-faint);
  }
  .truncate-note{
    margin-top:6px; font-size:.78rem; font-style:italic; color:var(--ink-faint);
  }
  .section-trunc-inline{
    background:none; border:none; padding:0; margin:0; cursor:pointer;
    font:inherit; font-style:normal; text-decoration:underline; color:var(--accent);
  }
  .repeat-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-style:italic;
    color:var(--ink-faint);
  }
  .section-part{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.72rem;
    text-transform:none; letter-spacing:0; color:var(--ink-faint);
  }
  .section-card.compact{padding:13px 20px;}
  .section-card.compact .section-card-head{margin-bottom:0;}

  .chord-line{display:flex; flex-wrap:wrap; gap:8px;}
  .chord-pill{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:calc(.8rem * var(--chord-scale, 1)); color:var(--chord);
    background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; padding:3px 8px;
  }

  .lyric-line{display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:8px; margin-bottom:13px;}
  .lyric-line:last-child{margin-bottom:0;}
  .chunk{display:flex; flex-direction:column; gap:3px; margin-right:16px;}
  .chunk:last-child{margin-right:0;}
  .chunk .chord{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:calc(.95rem * var(--chord-scale, 1));
    color:var(--chord); line-height:1; min-height:1em; white-space:nowrap;
  }
  .chunk .lyric{font-size:1rem; color:var(--ink); line-height:1.3; white-space:pre;}

  .empty-state{
    max-width:460px; margin-top:40px; padding:26px 28px; background:var(--surface);
    border:1px dashed var(--border); border-radius:14px; color:var(--ink-dim);
  }
  .empty-state h3{margin:0 0 8px; font-size:1.2rem; color:var(--ink);}
  .empty-state p{font-size:.9rem; line-height:1.55; margin:0 0 10px;}
  .empty-state code{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; background:var(--surface-2);
    padding:1px 6px; border-radius:5px; border:1px solid var(--border-soft);
  }

  /* ---------- Layout toggle (1 col: songs on top / 2 col: sidebar) ---------- */
  .layout-toggle{
    display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;
    margin-top:14px; background:var(--surface);
  }
  .layout-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.7rem; font-weight:600;
    padding:6px 11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .layout-btn:not(:last-child){border-right:1px solid var(--border);}
  .layout-btn.active{background:var(--accent); color:#fff;}
  .layout-btn:hover:not(.active){color:var(--ink);}

  .app.layout-1col{flex-direction:column;}
  .app.layout-1col .sidebar{
    width:100%; border-right:none; border-bottom:1px solid var(--border-soft);
    padding:16px; max-height:none;
  }
  .app.layout-1col .song-list{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;}
  .app.layout-1col .song-item{
    flex-direction:column; align-items:flex-start; gap:4px;
    width:150px; min-width:150px; max-width:150px; flex:0 0 auto; overflow:hidden;
  }
  .app.layout-1col .song-meta{width:100%; min-width:0;}
  .app.layout-1col .song-title, .app.layout-1col .song-artist{max-width:100%;}
  .app.layout-1col .chart-grid{column-count:1 !important; column-width:auto !important; max-width:720px;}
  /* Single-column is the mobile-friendly mode — size chords/lyrics up so
     they're easy to read at arm's length on a phone. */
  .app.layout-1col .chord-pill{font-size:calc(1rem * var(--chord-scale, 1)); padding:4px 10px;}
  .app.layout-1col .chunk{gap:5px; margin-right:20px;}
  .app.layout-1col .chunk .chord{font-size:calc(1.3rem * var(--chord-scale, 1));}
  .app.layout-1col .chunk .lyric{font-size:1.35rem; line-height:1.35;}
  .app.layout-1col .chord-line{gap:10px;}
  .app.layout-1col .lyric-line{row-gap:10px; margin-bottom:16px;}

  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; border-right:none; border-bottom:1px solid var(--border-soft);
      padding:16px; max-height:none;
    }
    .song-list{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;}
    .song-item{
      flex-direction:column; align-items:flex-start; gap:4px;
      width:150px; min-width:150px; max-width:150px; flex:0 0 auto; overflow:hidden;
    }
    .song-meta{width:100%; min-width:0;}
    .song-title, .song-artist{max-width:100%;}
    .main{padding:24px 18px 60px;}
    .chart-grid{columns: 1 100%;}
  }

  @page{ margin: 14mm; }
  @media print{
    :root, :root[data-theme="dark"]{
      --bg:#fff; --surface:#fff; --surface-2:#f7f7f5;
      --ink:#161616; --ink-dim:#454545; --ink-faint:#6f6f6f;
      --border:#cfcabb; --border-soft:#e2ded0;
      --chord:#7a4f19; --shadow:none;
    }
    body{background:#fff;}
    .app{display:block; max-width:none;}
    .sidebar, .view-toggle, .section-nav, .pdf-btn, #undoBtn, .section-close, .section-dup, .section-trunc, .section-trunc-inline, .drag-handle, .chord-size-control,
    .key-control .step-btn, .key-control select,
    .key-control label, .reset-link{ display:none !important; }
    .print-only{display:inline-block;}
    .main{padding:0; overflow:visible;}
    .chart-header{margin-bottom:14px;}
    .key-control{border:none; box-shadow:none; padding:0; background:transparent;}
    /* Match whatever column count the chart is showing on screen. 1-col mode
       is already forced to a single column by .app.layout-1col .chart-grid
       (an un-scoped !important rule, so it applies here too) -- this only
       needs to handle the 2-col case. column-width has to be overridden to
       auto, not just column-count set to 2: the on-screen rule's 400px
       minimum is still in effect otherwise, and a printed page's content
       area (well under 2*400px) would fail that minimum and collapse back
       down to a single column despite column-count saying 2. */
    .app:not(.layout-1col) .chart-grid{column-count:2 !important; column-width:auto !important; column-gap:16px;}
    .section-card{box-shadow:none; break-inside:avoid; page-break-inside:avoid;}
    .slides-overlay, .present-bar, .focus-bar, .focus-nav{display:none !important;}
    .focus-mode-grid .section-card{opacity:1 !important; transform:none !important; box-shadow:none !important;}
  }

  .present-bar{
    position:fixed; bottom:20px; right:20px; z-index:900;
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:8px 12px; box-shadow:var(--shadow);
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:var(--ink);
  }
  .present-bar[hidden]{display:none;}
  .present-bar-label{color:var(--ink-dim); white-space:nowrap;}
  .present-bar button{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);

/* ======================= MUSIC THEORY ======================= */

const NOTE_INDEX = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb']);
const ALL_KEYS = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

function shiftNote(note, steps, useFlats){
  const m = note.match(/^([A-Ga-g])(#|b)?/);
  if(!m) return note;
  const key = m[1].toUpperCase() + (m[2]||'');
  const idx = NOTE_INDEX[key];
  if(idx===undefined) return note;
  const newIdx = ((idx+steps)%12+12)%12;
  const scale = useFlats ? FLATS : SHARPS;
  return scale[newIdx] + note.slice(m[0].length);
}
function transposeToken(token, steps, useFlats){
  if(!token || steps===0) return token;
  return token.split('/').map((part,i)=> shiftNote(part, steps, useFlats)).join('/');
}
function transposeLabel(label, steps, useFlats){
  if(!label) return label;
  return label.split(' ').map(tok=>transposeToken(tok, steps, useFlats)).join(' ');
}
function stepsBetween(fromKey, toKey){
  return ((NOTE_INDEX[toKey]-NOTE_INDEX[fromKey])%12+12)%12;
}

/* ======================= RENDER ======================= */

const state = { currentId: SONGS[0].id, keyBySong: {}, viewMode: 'full', removedBySong: {}, orderBySong: {}, dupOriginBySong: {}, truncatedBySong: {}, layout: '1col', chordScale: 1, focusMode: false, focusPos: 0, setList: [], sharedView: false, hideAllSongs: false, presentingSet: false };

// Chord text size is a personal display preference (like the 1col/2col
// layout toggle), not part of a song's arrangement -- so it lives here as
// plain session state, not in keyBySong/etc, and never gets packed into the
// shareable set URL.
const CHORD_SCALE_MIN = 0.8, CHORD_SCALE_MAX = 1.8, CHORD_SCALE_STEP = 0.1;
let dragSourceIdx = null;

// The "order" array lists *slot ids* to render, in sequence — not
// necessarily one per section. A slot id under song.sections.length is a
// plain reference to that section (the untouched default: identity array
// 0..N-1). A slot id at or above song.sections.length is a duplicate,
// created by duplicateSection(), and its real content lives in
// dupOriginBySong. This is what lets the same section appear more than
// once in one song's arrangement -- each occurrence is still a distinct,
// independently orderable/removable slot, while both trace back to the
// same underlying chords/lyrics.
function getOrder(song){
  return state.orderBySong[song.id] || (state.orderBySong[song.id] = song.sections.map((_,i)=>i));
}

// Resolves a slot id (as found in the order array) to the actual index
// into song.sections whose content should be displayed there.
function getSectionIdx(song, slotId){
  if(slotId < song.sections.length) return slotId;
  const map = state.dupOriginBySong[song.id];
  return (map && slotId in map) ? map[slotId] : slotId;
}

function reorderSection(song, sourceIdx, targetIdx, after){
  const order = getOrder(song);
  const from = order.indexOf(sourceIdx);
  if(from===-1) return;
  order.splice(from, 1);
  let to = order.indexOf(targetIdx);
  if(to===-1) to = order.length; else if(after) to += 1;
  order.splice(to, 0, sourceIdx);
  renderAll();
}

// Inserts a new slot right after the source slot, referencing the same
// section content. The new slot id is always one past the highest slot id
// this song has ever used (order never drops a slot on removal -- it just
// gets hidden via removedBySong -- so Math.max(...order) is always the true
// high-water mark), which keeps every slot id permanently unique for this
// song without needing a separate counter.
function duplicateSection(song, slotId){
  const order = getOrder(song);
  const pos = order.indexOf(slotId);
  if(pos===-1) return;
  const contentIdx = getSectionIdx(song, slotId);
  const newSlotId = Math.max(song.sections.length - 1, ...order) + 1;
  order.splice(pos + 1, 0, newSlotId);
  const map = state.dupOriginBySong[song.id] || (state.dupOriginBySong[song.id] = {});
  map[newSlotId] = contentIdx;
  renderAll();
}

function removeSection(songId, idx){
  const stack = state.removedBySong[songId] || (state.removedBySong[songId] = []);
  if(!stack.includes(idx)) stack.push(idx);
  renderAll();
}
function undoRemove(songId){
  const stack = state.removedBySong[songId];
  if(stack && stack.length){ stack.pop(); renderAll(); }
}

// Truncating a section only shortens what the CHART shows -- it's a purely
// cosmetic/print-view toggle, unlike removedBySong (which also drops the
// section from the presentation). Deliberately not consulted anywhere in
// buildSlideGroups/getFocusPositions, so Present mode and the projector
// always show every line regardless of what's collapsed on the chart. A
// simple on/off toggle (not a stack like removedBySong) since the whole
// point is bringing back *this* section on demand, not just the last one
// truncated.
function isTruncated(songId, slotId){
  const arr = state.truncatedBySong[songId];
  return !!(arr && arr.includes(slotId));
}
function toggleTruncate(songId, slotId){
  const arr = state.truncatedBySong[songId] || (state.truncatedBySong[songId] = []);
  const i = arr.indexOf(slotId);
  if(i === -1) arr.push(slotId); else arr.splice(i, 1);
  renderAll();
}

/* ======================= THIS WEEK'S SET ======================= */

function addToSet(songId){
  if(!state.setList.includes(songId)){
    state.setList.push(songId);
    renderAll();
  }
}
function removeFromSet(songId){
  const i = state.setList.indexOf(songId);
  if(i !== -1){
    state.setList.splice(i, 1);
    renderAll();
  }
}
function reorderSet(sourceId, targetId, after){
  const from = state.setList.indexOf(sourceId);
  if(from === -1 || sourceId === targetId) return;
  state.setList.splice(from, 1);
  let to = state.setList.indexOf(targetId);
  if(to === -1) to = state.setList.length; else if(after) to += 1;
  state.setList.splice(to, 0, sourceId);
  renderAll();
}

// True only when a song's section order has actually been customized — an
// untouched song still picks up an identity-order array the first time it's
// rendered (getOrder's lazy default), and that default shouldn't bloat the
// shareable URL. A song with any duplicated section always counts as custom
// (its order is longer than song.sections.length), same as a reordered one.
function isCustomOrder(song){
  const order = state.orderBySong[song.id];
  if(!order) return false;
  const def = song.sections.map((_,i)=>i);
  if(order.length !== def.length) return true;
  return !order.every((v, i)=> v === def[i]);
}

// A sharp is the only ALL_KEYS character ('#') that isn't safe to reuse as
// one of our own URL delimiters, so it's swapped for a plain letter.
function keyToToken(key){ return key === 'F#' ? 'Fs' : key; }
function tokenToKey(token){ return token === 'Fs' ? 'F#' : token; }

// Packs "This Week's Set" — which songs, in what order, plus any per-song
// key change / removed sections / custom arrangement / duplicated sections
// / truncated sections — into a compact string for the URL fragment. Only
// songs actually in the set are encoded, and only fields that differ from
// that song's default.
// A duplicated section needs two things encoded together to round-trip: the
// slot id's place in the order sequence ('o', already handles that since a
// duplicate's slot id just appears in the list like any other) and which
// original section that slot id is a copy of ('d', new below) — without
// 'd' a decoded duplicate slot id would be meaningless on the other end.
function encodeSet(){
  const parts = state.setList.map(id=>{
    const song = SONGS.find(s=>s.id===id);
    if(!song) return null;
    const mods = [];
    const key = state.keyBySong[id];
    if(key && key !== song.originalKey) mods.push('k' + keyToToken(key));
    const removed = state.removedBySong[id];
    if(removed && removed.length) mods.push('r' + removed.join('-'));
    if(isCustomOrder(song)) mods.push('o' + state.orderBySong[id].join('-'));
    const dupMap = state.dupOriginBySong[id];
    const dupEntries = dupMap ? Object.keys(dupMap) : [];
    if(dupEntries.length) mods.push('d' + dupEntries.map(slotId=>`${slotId}.${dupMap[slotId]}`).join('-'));
    const truncated = state.truncatedBySong[id];
    if(truncated && truncated.length) mods.push('t' + truncated.join('-'));
    return mods.length ? `${song.code}:${mods.join(',')}` : song.code;
  }).filter(Boolean);
  return parts.join(';');
}

function decodeSet(str){
  const result = { setList: [], keyBySong: {}, removedBySong: {}, orderBySong: {}, dupOriginBySong: {}, truncatedBySong: {} };
  if(!str) return result;
  str.split(';').forEach(entry=>{
    if(!entry) return;
    const [codePart, modsPart] = entry.split(':');
    const song = SONGS.find(s=> s.code === codePart);
    if(!song) return; // unknown/retired code -- skip rather than break the whole link
    result.setList.push(song.id);
    if(!modsPart) return;
    // Collected first so 'd' (duplicate origins) is always applied before
    // 'o'/'r'/'t', regardless of what order the tokens appear in the string —
    // all three need the duplicate-origin map in hand to validate a slot id
    // that's >= song.sections.length.
    const tokens = modsPart.split(',').filter(Boolean);
    const dupTok = tokens.find(t=>t[0]==='d');
    if(dupTok){
      const map = {};
      dupTok.slice(1).split('-').forEach(pair=>{
        const [slotStr, srcStr] = pair.split('.');
        const slotId = parseInt(slotStr,10), src = parseInt(srcStr,10);
        if(!isNaN(slotId) && !isNaN(src) && slotId>=song.sections.length && src>=0 && src<song.sections.length){
          map[slotId] = src;
        }
      });
      if(Object.keys(map).length) result.dupOriginBySong[song.id] = map;
    }
    const dupMap = result.dupOriginBySong[song.id];
    const isValidSlot = n => n>=0 && (n<song.sections.length || (dupMap && n in dupMap));
    tokens.forEach(tok=>{
      const kind = tok[0], rest = tok.slice(1);
      if(!rest) return;
      if(kind === 'k'){
        const key = tokenToKey(rest);
        if(ALL_KEYS.includes(key)) result.keyBySong[song.id] = key;
      } else if(kind === 'r'){
        result.removedBySong[song.id] = rest.split('-').map(n=>parseInt(n,10)).filter(n=>!isNaN(n) && isValidSlot(n));
      } else if(kind === 'o'){
        const order = rest.split('-').map(n=>parseInt(n,10));
        const valid = order.length >= song.sections.length && order.every(n=>!isNaN(n) && isValidSlot(n));
        if(valid) result.orderBySong[song.id] = order;
      } else if(kind === 't'){
        result.truncatedBySong[song.id] = rest.split('-').map(n=>parseInt(n,10)).filter(n=>!isNaN(n) && isValidSlot(n));
      }
    });
  });
  return result;
}

// Builds the "#set=..." hash fragment for the current state. Pass
// forceShared:true to always stamp the &shared=1 marker (used by the Share
// button, so the link it hands out is marked as shared regardless of
// whether *this* browser's own address bar currently carries the marker).
function buildSetHash(forceShared){
  const encoded = encodeSet();
  if(!encoded) return '';
  const shared = forceShared || state.sharedView;
  return '#set=' + encoded + (shared ? '&shared=1' : '');
}

// Rewrites the URL's #set= fragment to match current state, without adding
// a browser-history entry for every keystroke/toggle/drag. Once a page has
// been opened from a shared link (state.sharedView), the &shared=1 marker
// is kept in the address bar too, so a refresh or bookmark still knows this
// is a shared link and keeps "All Songs" collapsed by default.
function syncUrlFromState(){
  const suffix = (location.pathname || '') + (location.search || '') + buildSetHash(false);
  try{ history.replaceState(null, '', suffix); }
  catch(e){ /* file:// or sandboxed contexts may block history API -- URL just won't self-update */ }
}

// Parses "#set=<entries>&shared=1" into its two parts without assuming
// &shared=1 is the only (or last) extra param that might ever be added.
function parseSetHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw.startsWith('set=')) return null;
  const [setPart, ...rest] = raw.split('&');
  const params = new URLSearchParams(rest.join('&'));
  return { encoded: setPart.slice(4), shared: params.get('shared') === '1' };
}

// Reads a #set=... link on page load and applies it to state before the
// first render, so opening a shared link shows the set immediately. A link
// carrying &shared=1 collapses "All Songs" behind an "Add more songs"
// button, since a link handed to someone else is usually meant to be read,
// not edited from scratch.
function loadSetFromLocation(){
  const parsed = parseSetHash();
  if(!parsed) return;
  const decoded = decodeSet(parsed.encoded);
  if(!decoded.setList.length) return;
  state.setList = decoded.setList;
  Object.assign(state.keyBySong, decoded.keyBySong);
  Object.assign(state.removedBySong, decoded.removedBySong);
  Object.assign(state.orderBySong, decoded.orderBySong);
  Object.assign(state.dupOriginBySong, decoded.dupOriginBySong);
  Object.assign(state.truncatedBySong, decoded.truncatedBySong);
  state.currentId = decoded.setList[0];
  if(parsed.shared){
    state.sharedView = true;
    state.hideAllSongs = true;
  }
}

const TYPE_META = {
  intro:        { label:'Intro',        abbr:'I',  color:'var(--sec-intro)' },
  refrain:      { label:'Refrain',      abbr:'Rf', color:'var(--sec-intro)' },
  verse:        { label:'Verse',        abbr:'V',  color:'var(--sec-verse)' },
  chorus:       { label:'Chorus',       abbr:'C',  color:'var(--sec-chorus)' },
  halfchorus:   { label:'Half-Chorus',  abbr:'Hc', color:'var(--sec-chorus)' },
  altchorus:    { label:'Alt Chorus',   abbr:'Ac', color:'var(--sec-chorus)' },
  prechorus:    { label:'Pre-Chorus',   abbr:'Pc', color:'var(--sec-verse)' },
  bridge:       { label:'Bridge',       abbr:'B',  color:'var(--sec-bridge)' },
  instrumental: { label:'Instrumental', abbr:'Is', color:'var(--sec-inst)' },
  interlude:    { label:'Interlude',    abbr:'Il', color:'var(--sec-inst)' },
  channel:      { label:'Channel',      abbr:'Ch', color:'var(--sec-inst)' },
  breakdown:    { label:'Breakdown',    abbr:'Bd', color:'var(--sec-break)' },
  tag:          { label:'Tag',          abbr:'Tg', color:'var(--sec-tag)' },
  vamp:         { label:'Vamp',         abbr:'Vp', color:'var(--sec-tag)' },
  outro:        { label:'Outro',        abbr:'O',  color:'var(--sec-outro)' },
};

function sectionMeta(section){
  const meta = TYPE_META[section.type] || TYPE_META.verse;
  const label = section.n ? `${meta.label} ${section.n}` : meta.label;
  const abbr  = section.n ? `${meta.abbr}${section.n}` : meta.abbr;
  return { label, abbr, color: meta.color };
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// Flags each *visible, in-arrangement-order* slot that has identical content
// (lyrics + chords, ignoring production notes) to an earlier slot, so
// minimal view can collapse it to a one-line "repeat" reference instead of
// reprinting it. Walking the current display order (rather than song.sections'
// raw authoring order) means this naturally catches a user-duplicated
// section too -- a duplicate slot always matches its source's signature --
// and always labels the "repeat of ___" against whichever occurrence is
// actually shown first on screen right now, matching any custom order.
// Returns an array parallel to slotIds (not indexed by content idx).
function computeRepeats(song, slotIds){
  const seen = [];
  return slotIds.map(slotId=>{
    const sec = song.sections[getSectionIdx(song, slotId)];
    const sig = JSON.stringify({
      type: sec.type, n: sec.n || null,
      lines: sec.lines || null,
      chordLine: sec.chordLine || null,
      chordLine2: sec.chordLine2 || null,
    });
    const match = seen.find(s => s.sig === sig);
    if(match){
      return { isRepeat:true, ofLabel: match.label };
    }
    seen.push({ sig, label: sectionMeta(sec).label });
    return { isRepeat:false };
  });
}

let setDragSourceId = null;

function renderSongList(){
  const wrap = document.getElementById('songListWrap');
  const inSet = new Set(state.setList);

  const setItems = state.setList.map((id, pos)=>{
    const song = SONGS.find(s=>s.id===id);
    if(!song) return '';
    const key = song.pending ? null : (state.keyBySong[song.id] || song.originalKey);
    const active = song.id === state.currentId;
    return `<li class="song-item set-item ${active?'active':''}" data-id="${song.id}">
      <span class="drag-handle" draggable="true" data-id="${song.id}" title="Drag to reorder the set">
        <svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2" r="1.4"/><circle cx="7.5" cy="2" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="14" r="1.4"/><circle cx="7.5" cy="14" r="1.4"/></svg>
      </span>
      <span class="song-num">${pos+1}</span>
      <span class="song-meta">
        <div class="song-title">${esc(song.title)}</div>
        <div class="song-artist">${esc(song.artist)}</div>
      </span>
      <span class="song-key-pill ${key?'':'empty'}">${key || '—'}</span>
      <button class="set-remove-btn" data-id="${song.id}" title="Remove from this week's set">&times;</button>
    </li>`;
  }).join('');

  // Sorted alphabetically by title for display only -- SONGS itself can stay
  // in whatever order new entries get appended in; this keeps the "All
  // Songs" list correctly alphabetized without ever needing manual
  // reordering, and doesn't touch song.id/song.code, so URL sharing
  // (which is keyed entirely on those, never on array position) is
  // unaffected regardless of where a new song lands in the source array.
  const sortedSongs = SONGS.slice().sort((a, b)=> a.title.localeCompare(b.title, undefined, {sensitivity:'base', numeric:true}));
  const allItems = sortedSongs.map((song, i)=>{
    const key = song.pending ? null : (state.keyBySong[song.id] || song.originalKey);
    const active = song.id === state.currentId;
    const added = inSet.has(song.id);
    return `<li class="song-item ${active?'active':''} ${song.pending?'pending':''}" data-id="${song.id}">
      <span class="song-num">${i+1}</span>
      <span class="song-meta">
        <div class="song-title">${esc(song.title)}</div>
        <div class="song-artist">${esc(song.artist)}</div>
      </span>
      <span class="song-key-pill ${key?'':'empty'}">${key || '—'}</span>
      <button class="set-add-btn ${added?'added':''}" data-id="${song.id}" ${added?'disabled':''}
        title="${added ? "Already in this week's set" : "Add to this week's set"}">${added ? '&check;' : '&plus;'}</button>
    </li>`;
  }).join('');

  wrap.innerHTML = `
    <div class="song-section">
      <div class="song-section-head">
        <span class="song-section-title">This Week's Set</span>
        ${state.setList.length ? `<button class="share-btn" id="shareBtn" title="Copy a shareable link to this set">Share</button>` : ''}
      </div>
      ${state.setList.length
        ? `<ul class="song-list set-list" id="setList">${setItems}</ul>`
        : `<p class="set-empty">Tap <strong>+</strong> on a song below to build this week's set — the set becomes a shareable link automatically.</p>`}
    </div>
    ${state.hideAllSongs
      ? `<div class="song-section">
          <button class="reveal-all-btn" id="revealAllSongsBtn">+ Add more songs</button>
        </div>`
      : `<div class="song-section">
          <div class="song-section-head">
            <span class="song-section-title">All Songs</span>
            <button class="hide-all-btn" id="hideAllSongsBtn" title="Hide this list">Hide</button>
          </div>
          <ul class="song-list" id="allSongsList">${allItems}</ul>
        </div>`}
  `;

  wrap.querySelectorAll('.song-item').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('button, .drag-handle')) return;
      state.currentId = el.dataset.id; renderAll();
    });
  });
  wrap.querySelectorAll('.set-add-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); addToSet(btn.dataset.id); });
  });
  wrap.querySelectorAll('.set-remove-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); removeFromSet(btn.dataset.id); });
  });
  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn) shareBtn.addEventListener('click', e=>{
    e.stopPropagation();
    // Always stamp &shared=1 on the copied link, regardless of whether this
    // browser's own address bar currently carries it -- the person you hand
    // this to should get the collapsed "All Songs" / "Add more songs" view.
    const url = location.origin + location.pathname + location.search + buildSetHash(true);
    const done = ()=>{
      shareBtn.textContent = 'Copied!';
      shareBtn.classList.add('copied');
      setTimeout(()=>{ shareBtn.textContent = 'Share'; shareBtn.classList.remove('copied'); }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>{ prompt('Copy this link:', url); });
    } else {
      prompt('Copy this link:', url);
    }
  });
  const revealBtn = document.getElementById('revealAllSongsBtn');
  if(revealBtn) revealBtn.addEventListener('click', e=>{
    e.stopPropagation();
    state.hideAllSongs = false;
    renderAll();
  });
  const hideBtn = document.getElementById('hideAllSongsBtn');
  if(hideBtn) hideBtn.addEventListener('click', e=>{
    e.stopPropagation();
    state.hideAllSongs = true;
    renderAll();
  });

  const setListEl = document.getElementById('setList');
  if(setListEl){
    setListEl.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.addEventListener('dragstart', e=>{
        setDragSourceId = handle.dataset.id;
        const item = handle.closest('.song-item');
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setDragImage(item, 20, 20);
        try{ e.dataTransfer.setData('text/plain', setDragSourceId); }catch(err){}
      });
      handle.addEventListener('dragend', ()=>{
        setListEl.querySelectorAll('.song-item').forEach(li=>li.classList.remove('dragging','drag-over-top','drag-over-bottom'));
        setDragSourceId = null;
      });
    });
    setListEl.querySelectorAll('.song-item').forEach(item=>{
      item.addEventListener('dragover', e=>{
        if(setDragSourceId===null) return;
        e.preventDefault();
        const targetId = item.dataset.id;
        if(targetId === setDragSourceId) return;
        const rect = item.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height/2;
        item.classList.toggle('drag-over-top', !after);
        item.classList.toggle('drag-over-bottom', after);
      });
      item.addEventListener('dragleave', ()=>{
        item.classList.remove('drag-over-top','drag-over-bottom');
      });
      item.addEventListener('drop', e=>{
        e.preventDefault();
        const targetId = item.dataset.id;
        const after = item.classList.contains('drag-over-bottom');
        item.classList.remove('drag-over-top','drag-over-bottom');
        if(setDragSourceId===null || targetId===setDragSourceId) return;
        reorderSet(setDragSourceId, targetId, after);
      });
    });
  }
}

function renderChunk(chunk, steps, useFlats){
  const chord = transposeLabel(chunk.c, steps, useFlats);
  return `<span class="chunk"><span class="chord">${esc(chord)}</span><span class="lyric">${esc(chunk.l) || '&nbsp;'}</span></span>`;
}

const DUP_ICON = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="6" width="10" height="10.5" rx="1.2"/><path d="M6.5 6V4.5a1 1 0 0 1 1-1H16a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1h-1.5"/></svg>`;
// Collapse (truncate) / expand (restore) glyphs -- a simple chevron pair so
// the one button's icon (and title) flips to show which action it'll do.
const TRUNC_ICON  = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7.5 10 12.5 15 7.5"/></svg>`;
const EXPAND_ICON = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12.5 10 7.5 15 12.5"/></svg>`;

// Truncating a section only ever hides *lyric lines* on the CHART -- the
// chords stay visible, and the section itself stays fully in the
// arrangement (present in the order, still counted for repeats, still
// built into the presentation in full -- see the note on isTruncated).
// Showing just the first line keeps a card recognizable at a glance, which
// is the point: it's a "collapse a part you've already memorized" control,
// not a delete.
const TRUNCATE_KEEP_LINES = 1;

function renderSection(section, idx, steps, useFlats, repeatInfo, focused, isDupSlot, isTrunc){
  const meta = sectionMeta(section);
  const anchorId = `sec-${idx}`;
  const chordOnly = !section.lines && (section.chordLine || section.chordLine2) ? ' chord-only' : '';
  const focusedCls = focused ? ' focused' : '';
  const dupTag = isDupSlot ? `<span class="dup-tag">duplicated</span>` : '';
  const canTruncate = !!(section.lines && section.lines.length > TRUNCATE_KEEP_LINES);
  const truncTag = (isTrunc && canTruncate) ? `<span class="trunc-tag">truncated</span>` : '';
  const truncBtn = canTruncate
    ? `<button class="section-trunc${isTrunc?' active':''}" data-idx="${idx}" title="${isTrunc ? 'Show the full section' : 'Truncate this section'}">${isTrunc ? EXPAND_ICON : TRUNC_ICON}</button>`
    : '';

  const handle = `<span class="drag-handle" draggable="true" data-idx="${idx}" title="Drag to reorder">
    <svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2" r="1.4"/><circle cx="7.5" cy="2" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="14" r="1.4"/><circle cx="7.5" cy="14" r="1.4"/></svg>
  </span>`;

  if(repeatInfo && repeatInfo.isRepeat){
    return `<div class="section-card compact${chordOnly}${focusedCls}" id="${anchorId}" data-idx="${idx}" style="--badge-color:${meta.color}">
      <div class="section-card-head">
        ${handle}
        <span class="badge">${meta.abbr}</span>
        <span class="section-label">${meta.label}</span>
        <span class="repeat-tag">repeat &middot; same as ${esc(repeatInfo.ofLabel)}</span>
        <span class="head-right">
          ${section.note ? `<span class="section-note">${esc(section.note)}</span>` : ''}
          ${dupTag}
          <button class="section-dup" data-idx="${idx}" title="Duplicate this section">${DUP_ICON}</button>
          <button class="section-close" data-idx="${idx}" title="Remove this section">&times;</button>
        </span>
      </div>
    </div>`;
  }

  let body = '';
  if(section.chordLine){
    body += `<div class="chord-line">${section.chordLine.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
  }
  if(section.chordLine2){
    body += `<div class="chord-line" style="margin-top:8px;">${section.chordLine2.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
  }
  if(section.lines){
    const doTrunc = isTrunc && canTruncate;
    const linesToShow = doTrunc ? section.lines.slice(0, TRUNCATE_KEEP_LINES) : section.lines;
    body += linesToShow.map(line=>`<div class="lyric-line">${line.map(ch=>renderChunk(ch, steps, useFlats)).join('')}</div>`).join('');
    if(doTrunc){
      const hidden = section.lines.length - TRUNCATE_KEEP_LINES;
      body += `<div class="truncate-note">&hellip; ${hidden} more line${hidden===1?'':'s'} hidden &middot; <button class="section-trunc-inline" data-idx="${idx}">Show full section</button></div>`;
    }
  }
  return `<div class="section-card${chordOnly}${focusedCls}" id="${anchorId}" data-idx="${idx}" style="--badge-color:${meta.color}">
    <div class="section-card-head">
      ${handle}
      <span class="badge">${meta.abbr}</span>
      <span class="section-label">${meta.label}</span>
      <span class="head-right">
        ${section.note ? `<span class="section-note">${esc(section.note)}</span>` : ''}
        ${truncTag}
        ${dupTag}
        ${truncBtn}
        <button class="section-dup" data-idx="${idx}" title="Duplicate this section">${DUP_ICON}</button>
        <button class="section-close" data-idx="${idx}" title="Remove this section">&times;</button>
      </span>
    </div>
    ${body}
  </div>`;
}

function renderMain(){

    renderFocusView();

  const song = SONGS.find(s=>s.id===state.currentId);

  if(song.pending){
    main.innerHTML = `
      <div class="chart-header">
