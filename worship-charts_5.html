<!doctype html>
<title>Sunday Set Charts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#EEEAE0;
    --surface:#FFFFFF;
    --surface-2:#F6F2E8;
    --ink:#22252A;
    --ink-dim:#5C5F66;
    --ink-faint:#8C8F94;
    --border:#DFDACA;
    --border-soft:#E9E4D5;
    --accent:#AD7A34;
    --accent-strong:#8C5F22;
    --chord:#8C5F22;
    --sec-intro:#3F7D74;
    --sec-verse:#4C5A93;
    --sec-chorus:#AD7A34;
    --sec-bridge:#9C4B5A;
    --sec-inst:#6B6F76;
    --sec-break:#6B3F5C;
    --sec-tag:#3F7D74;
    --sec-outro:#6B6F76;
    --shadow: 0 1px 2px rgba(30,25,15,.07), 0 6px 18px rgba(30,25,15,.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181C;
      --surface:#1F2126;
      --surface-2:#1A1C21;
      --ink:#EEEBE3;
      --ink-dim:#A8ABB1;
      --ink-faint:#787B81;
      --border:#34373E;
      --border-soft:#2A2D33;
      --accent:#D7A95D;
      --accent-strong:#E8BD79;
      --chord:#E8BD79;
      --sec-intro:#62AB9F;
      --sec-verse:#8391D6;
      --sec-chorus:#D7A95D;
      --sec-bridge:#CC7C95;
      --sec-inst:#9DA1A9;
      --sec-break:#A96FA4;
      --sec-tag:#62AB9F;
      --sec-outro:#9DA1A9;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181C;
    --surface:#1F2126;
    --surface-2:#1A1C21;
    --ink:#EEEBE3;
    --ink-dim:#A8ABB1;
    --ink-faint:#787B81;
    --border:#34373E;
    --border-soft:#2A2D33;
    --accent:#D7A95D;
    --accent-strong:#E8BD79;
    --chord:#E8BD79;
    --sec-intro:#62AB9F;
    --sec-verse:#8391D6;
    --sec-chorus:#D7A95D;
    --sec-bridge:#CC7C95;
    --sec-inst:#9DA1A9;
    --sec-break:#A96FA4;
    --sec-tag:#62AB9F;
    --sec-outro:#9DA1A9;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance;}

  .app{display:flex; min-height:100vh; max-width:1400px; margin:0 auto;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:290px; flex-shrink:0;
    background:var(--surface-2);
    border-right:1px solid var(--border-soft);
    padding:26px 18px 40px;
    overflow-y:auto;
  }
  .brand{padding:2px 8px 20px;}
  .brand .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase; color:var(--accent-strong);
  }
  .brand h1{font-size:1.5rem; font-weight:600; margin:.2em 0 0; color:var(--ink); line-height:1.15;}
  .brand p{margin:.35em 0 0; font-size:.82rem; color:var(--ink-dim);}

  .song-list{list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:3px;}
  .song-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:10px; cursor:pointer;
    border:1px solid transparent;
  }
  .song-item:hover{background:var(--surface);}
  .song-item.active{background:var(--surface); border-color:var(--border); box-shadow:var(--shadow);}
  .song-num{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--ink-faint);
    width:1.4em; flex-shrink:0; text-align:right;
  }
  .song-item.active .song-num{color:var(--accent-strong); font-weight:600;}
  .song-meta{flex:1; min-width:0;}
  .song-title{font-size:.87rem; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-artist{font-size:.74rem; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-key-pill{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; font-weight:600;
    color:var(--ink-dim); border:1px solid var(--border); border-radius:6px;
    padding:2px 6px; flex-shrink:0;
  }
  .song-item.pending .song-title{color:var(--ink-faint); font-weight:500;}
  .song-key-pill.empty{color:var(--ink-faint); border-style:dashed;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:34px 44px 80px; overflow-y:auto;}

  .chart-header{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:20px;}
  .chart-header h2{font-size:2.1rem; font-weight:600; margin:0; color:var(--ink); line-height:1.1;}
  .chart-header .artist{margin:.3em 0 0; font-size:1rem; color:var(--ink-dim); font-style:italic; font-family:'Fraunces', serif;}

  .meta-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .meta-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:500; color:var(--ink-dim);
    border:1px solid var(--border); border-radius:7px; padding:5px 9px; background:var(--surface);
  }
  .view-toggle{
    display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .toggle-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:600;
    padding:7px 13px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .toggle-btn:not(:last-child){border-right:1px solid var(--border);}
  .toggle-btn.active{background:var(--accent); color:#fff;}
  .toggle-btn:hover:not(.active){color:var(--ink);}

  .chart-grid.hide-chords .section-card.chord-only{display:none;}
  .chart-grid.hide-chords .chord-line{display:none;}
  .chart-grid.hide-chords .chunk .chord{display:none;}
  .chart-grid.hide-chords .chunk{gap:0;}
  .section-nav.hide-chords .nav-pill.chord-only{display:none;}

  .key-control{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:6px 8px 6px 14px; box-shadow:var(--shadow);
  }
  .key-control label{font-size:.72rem; font-weight:600; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;}
  .key-control select{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.95rem;
    color:var(--ink); background:transparent; border:none; padding:2px 4px; cursor:pointer;
  }
  .step-btn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); font-size:.95rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .step-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .reset-link{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; color:var(--accent-strong);
    background:none; border:none; cursor:pointer; text-decoration:underline; padding:0 2px;
  }

  .pdf-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-weight:600;
    color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:8px 13px; cursor:pointer; box-shadow:var(--shadow);
  }
  .pdf-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .pdf-btn svg{width:13px; height:13px; flex-shrink:0;}

  .print-only{display:none;}

  .section-nav{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0 26px;}
  .nav-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 11px 4px 5px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:.71rem; font-weight:600;
  }
  .nav-pill:hover{border-color:var(--pill-color, var(--accent));}
  .nav-dot{
    width:17px; height:17px; border-radius:50%; border:2px solid var(--pill-color, var(--accent));
    color:var(--pill-color, var(--accent)); display:flex; align-items:center; justify-content:center;
    font-size:.58rem; font-weight:700; flex-shrink:0;
  }

  .chart-grid{columns: 2 400px; column-gap:18px;}
  .section-card{
    break-inside:avoid; display:block;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px 20px; margin:0 0 18px; box-shadow:var(--shadow); scroll-margin-top:20px;
    transition:opacity .15s, box-shadow .1s;
  }
  .section-card.dragging{opacity:.35;}
  .section-card.drag-over-top{box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow);}
  .section-card.drag-over-bottom{box-shadow: inset 0 -3px 0 0 var(--accent), var(--shadow);}
  .section-card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .drag-handle{
    cursor:grab; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; flex-shrink:0; margin-right:-2px;
  }
  .drag-handle:hover{color:var(--ink-dim);}
  .drag-handle:active{cursor:grabbing;}
  .drag-handle svg{width:11px; height:16px;}
  .badge{
    width:32px; height:32px; border-radius:50%; border:2px solid var(--badge-color, var(--accent));
    color:var(--badge-color, var(--accent)); display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:.72rem; flex-shrink:0;
  }
  .section-label{font-weight:700; font-size:.83rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink);}
  .head-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .section-note{font-size:.72rem; font-style:italic; color:var(--ink-faint); white-space:nowrap;}
  .section-close{
    width:22px; height:22px; border-radius:6px; border:1px solid transparent; flex-shrink:0;
    background:transparent; color:var(--ink-faint); font-size:.78rem; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .section-close:hover{background:var(--surface-2); border-color:var(--border); color:#B23B3B;}
  .repeat-tag{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; font-style:italic;
    color:var(--ink-faint);
  }
  .section-part{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.72rem;
    text-transform:none; letter-spacing:0; color:var(--ink-faint);
  }
  .section-card.compact{padding:13px 20px;}
  .section-card.compact .section-card-head{margin-bottom:0;}

  .chord-line{display:flex; flex-wrap:wrap; gap:8px;}
  .chord-pill{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.8rem; color:var(--chord);
    background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; padding:3px 8px;
  }

  .lyric-line{display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:8px; margin-bottom:13px;}
  .lyric-line:last-child{margin-bottom:0;}
  .chunk{display:flex; flex-direction:column; gap:3px; margin-right:16px;}
  .chunk:last-child{margin-right:0;}
  .chunk .chord{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:.95rem;
    color:var(--chord); line-height:1; min-height:1em; white-space:nowrap;
  }
  .chunk .lyric{font-size:1rem; color:var(--ink); line-height:1.3; white-space:pre;}

  .empty-state{
    max-width:460px; margin-top:40px; padding:26px 28px; background:var(--surface);
    border:1px dashed var(--border); border-radius:14px; color:var(--ink-dim);
  }
  .empty-state h3{margin:0 0 8px; font-size:1.2rem; color:var(--ink);}
  .empty-state p{font-size:.9rem; line-height:1.55; margin:0 0 10px;}
  .empty-state code{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; background:var(--surface-2);
    padding:1px 6px; border-radius:5px; border:1px solid var(--border-soft);
  }

  /* ---------- Layout toggle (1 col: songs on top / 2 col: sidebar) ---------- */
  .layout-toggle{
    display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;
    margin-top:14px; background:var(--surface);
  }
  .layout-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.7rem; font-weight:600;
    padding:6px 11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .layout-btn:not(:last-child){border-right:1px solid var(--border);}
  .layout-btn.active{background:var(--accent); color:#fff;}
  .layout-btn:hover:not(.active){color:var(--ink);}

  .app.layout-1col{flex-direction:column;}
  .app.layout-1col .sidebar{
    width:100%; border-right:none; border-bottom:1px solid var(--border-soft);
    padding:16px; max-height:none;
  }
  .app.layout-1col .song-list{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;}
  .app.layout-1col .song-item{
    flex-direction:column; align-items:flex-start; gap:4px;
    width:150px; min-width:150px; max-width:150px; flex:0 0 auto; overflow:hidden;
  }
  .app.layout-1col .song-meta{width:100%; min-width:0;}
  .app.layout-1col .song-title, .app.layout-1col .song-artist{max-width:100%;}
  .app.layout-1col .chart-grid{column-count:1 !important; column-width:auto !important; max-width:720px;}
  /* Single-column is the mobile-friendly mode — size chords/lyrics up so
     they're easy to read at arm's length on a phone. */
  .app.layout-1col .chord-pill{font-size:1rem; padding:4px 10px;}
  .app.layout-1col .chunk{gap:5px; margin-right:20px;}
  .app.layout-1col .chunk .chord{font-size:1.3rem;}
  .app.layout-1col .chunk .lyric{font-size:1.35rem; line-height:1.35;}
  .app.layout-1col .chord-line{gap:10px;}
  .app.layout-1col .lyric-line{row-gap:10px; margin-bottom:16px;}

  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; border-right:none; border-bottom:1px solid var(--border-soft);
      padding:16px; max-height:none;
    }
    .song-list{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;}
    .song-item{
      flex-direction:column; align-items:flex-start; gap:4px;
      width:150px; min-width:150px; max-width:150px; flex:0 0 auto; overflow:hidden;
    }
    .song-meta{width:100%; min-width:0;}
    .song-title, .song-artist{max-width:100%;}
    .main{padding:24px 18px 60px;}
    .chart-grid{columns: 1 100%;}
  }

  @page{ margin: 14mm; }
  @media print{
    :root, :root[data-theme="dark"]{
      --bg:#fff; --surface:#fff; --surface-2:#f7f7f5;
      --ink:#161616; --ink-dim:#454545; --ink-faint:#6f6f6f;
      --border:#cfcabb; --border-soft:#e2ded0;
      --chord:#7a4f19; --shadow:none;
    }
    body{background:#fff;}
    .app{display:block; max-width:none;}
    .sidebar, .view-toggle, .section-nav, .pdf-btn, #undoBtn, .section-close, .drag-handle,
    .key-control .step-btn, .key-control select,
    .key-control label, .reset-link{ display:none !important; }
    .print-only{display:inline-block;}
    .main{padding:0; overflow:visible;}
    .chart-header{margin-bottom:14px;}
    .key-control{border:none; box-shadow:none; padding:0; background:transparent;}
    .chart-grid{columns:1; column-count:1;}
    .section-card{box-shadow:none; break-inside:avoid; page-break-inside:avoid;}
    .slides-overlay, .present-bar, .focus-bar, .focus-nav{display:none !important;}
    .focus-mode-grid .section-card{opacity:1 !important; transform:none !important; box-shadow:none !important;}
  }

  .present-bar{
    position:fixed; bottom:20px; right:20px; z-index:900;
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:8px 12px; box-shadow:var(--shadow);
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:var(--ink);
  }
  .present-bar[hidden]{display:none;}
  .present-bar-label{color:var(--ink-dim); white-space:nowrap;}
  .present-bar button{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .present-bar button:hover{border-color:var(--accent); color:var(--accent-strong);}
  .present-bar-close{color:var(--ink-faint) !important;}
  .present-bar-counter{white-space:nowrap; min-width:3.2em; text-align:center;}

  /* ---------- Chart focus mode (present + follow-along on the chart itself) ---------- */
  .app.focus-active .sidebar{display:none;}
  .app.focus-active .main{max-width:900px; margin:0 auto; width:100%;}

  .focus-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:2px 2px 16px; margin-bottom:18px; border-bottom:1px solid var(--border-soft);
  }
  .focus-exit{
    font-family:'IBM Plex Mono', monospace; font-size:.74rem; font-weight:600;
    padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-dim); cursor:pointer; flex-shrink:0;
  }
  .focus-exit:hover{color:var(--ink); border-color:var(--accent);}
  .focus-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; color:var(--ink);
    text-align:center; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .focus-counter{
    font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--ink-faint);
    white-space:nowrap; flex-shrink:0;
  }

  .focus-mode-grid{columns:1; max-width:760px; margin:0 auto; padding-bottom:90px;}
  /* Presentation view for the musician playing along — bigger still than the
     regular single-column chart, since it's read at a glance while playing.
     Selectors are chained with .chart-grid (always present alongside
     .focus-mode-grid) purely to out-specificity the .app.layout-1col text
     rules above, which would otherwise win the cascade tie and mask these. */
  .focus-mode-grid.chart-grid .chord-pill{font-size:1.05rem; padding:4px 10px;}
  .focus-mode-grid.chart-grid .chunk{gap:5px; margin-right:22px;}
  .focus-mode-grid.chart-grid .chunk .chord{font-size:1.4rem;}
  .focus-mode-grid.chart-grid .chunk .lyric{font-size:1.45rem; line-height:1.35;}
  .focus-mode-grid.chart-grid .chord-line{gap:11px;}
  .focus-mode-grid.chart-grid .lyric-line{row-gap:11px; margin-bottom:18px;}
  .focus-mode-grid .section-card{
    opacity:.7; transform:scale(.99);
    transition:opacity .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .focus-mode-grid .section-card.focused{
    opacity:1; transform:scale(1);
    box-shadow:0 0 0 2px var(--accent), var(--shadow);
  }
  .focus-mode-grid .drag-handle, .focus-mode-grid .section-close{display:none;}

  .focus-nav{
    position:fixed; right:26px; bottom:26px; z-index:20;
    display:flex; flex-direction:column; gap:10px;
  }
  .focus-nav-btn{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-dim); box-shadow:var(--shadow);
    font-size:1.35rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .focus-nav-btn:hover:not(:disabled){color:var(--accent-strong); border-color:var(--accent);}
  .focus-nav-btn:disabled{opacity:.3; cursor:default;}
  @media (max-width:640px){
    .focus-nav{right:16px; bottom:16px;}
    .focus-nav-btn{width:46px; height:46px; font-size:1.2rem;}
  }

  .slides-overlay{
    position:fixed; inset:0; z-index:1000; background:#0a0a0a; color:#f5f3ec;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    padding:8vh 9vw; text-align:center; user-select:none; touch-action:none;
  }
  .slides-overlay[hidden]{display:none;}
  .slide-label{
    position:absolute; top:26px; left:32px;
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(245,243,236,.4);
  }
  .slide-text{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(1.6rem, 4.6vw, 3.6rem);
    line-height:1.35; max-width:100%; white-space:normal;
  }
  .slide-counter{
    position:absolute; bottom:26px; right:32px;
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:rgba(245,243,236,.4);
  }
  .slide-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(245,243,236,.08); color:#f5f3ec; font-size:1.7rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

/* ======================= MUSIC THEORY ======================= */

const NOTE_INDEX = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb']);
const ALL_KEYS = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

function shiftNote(note, steps, useFlats){
  const m = note.match(/^([A-Ga-g])(#|b)?/);
  if(!m) return note;
  const key = m[1].toUpperCase() + (m[2]||'');
  const idx = NOTE_INDEX[key];
  if(idx===undefined) return note;
  const newIdx = ((idx+steps)%12+12)%12;
  const scale = useFlats ? FLATS : SHARPS;
  return scale[newIdx] + note.slice(m[0].length);
}
function transposeToken(token, steps, useFlats){
  if(!token || steps===0) return token;
  return token.split('/').map((part,i)=> shiftNote(part, steps, useFlats)).join('/');
}
function transposeLabel(label, steps, useFlats){
  if(!label) return label;
  return label.split(' ').map(tok=>transposeToken(tok, steps, useFlats)).join(' ');
}
function stepsBetween(fromKey, toKey){
  return ((NOTE_INDEX[toKey]-NOTE_INDEX[fromKey])%12+12)%12;
}

/* ======================= RENDER ======================= */

const state = { currentId: SONGS[0].id, keyBySong: {}, viewMode: 'full', removedBySong: {}, orderBySong: {}, layout: '1col', focusMode: false, focusPos: 0 };
let dragSourceIdx = null;

function getOrder(song){
  return state.orderBySong[song.id] || (state.orderBySong[song.id] = song.sections.map((_,i)=>i));
}
function reorderSection(song, sourceIdx, targetIdx, after){
  const order = getOrder(song);
  const from = order.indexOf(sourceIdx);
  if(from===-1) return;
  order.splice(from, 1);
  let to = order.indexOf(targetIdx);
  if(to===-1) to = order.length; else if(after) to += 1;
  order.splice(to, 0, sourceIdx);
  renderAll();
}

function removeSection(songId, idx){
  const stack = state.removedBySong[songId] || (state.removedBySong[songId] = []);
  if(!stack.includes(idx)) stack.push(idx);
  renderAll();
}
function undoRemove(songId){
  const stack = state.removedBySong[songId];
  if(stack && stack.length){ stack.pop(); renderAll(); }
}

const TYPE_META = {
  intro:        { label:'Intro',        abbr:'I',  color:'var(--sec-intro)' },
  refrain:      { label:'Refrain',      abbr:'Rf', color:'var(--sec-intro)' },
  verse:        { label:'Verse',        abbr:'V',  color:'var(--sec-verse)' },
  chorus:       { label:'Chorus',       abbr:'C',  color:'var(--sec-chorus)' },
  halfchorus:   { label:'Half-Chorus',  abbr:'Hc', color:'var(--sec-chorus)' },
  altchorus:    { label:'Alt Chorus',   abbr:'Ac', color:'var(--sec-chorus)' },
  prechorus:    { label:'Pre-Chorus',   abbr:'Pc', color:'var(--sec-verse)' },
  bridge:       { label:'Bridge',       abbr:'B',  color:'var(--sec-bridge)' },
  instrumental: { label:'Instrumental', abbr:'Is', color:'var(--sec-inst)' },
  interlude:    { label:'Interlude',    abbr:'Il', color:'var(--sec-inst)' },
  channel:      { label:'Channel',      abbr:'Ch', color:'var(--sec-inst)' },
  breakdown:    { label:'Breakdown',    abbr:'Bd', color:'var(--sec-break)' },
  tag:          { label:'Tag',          abbr:'Tg', color:'var(--sec-tag)' },
  vamp:         { label:'Vamp',         abbr:'Vp', color:'var(--sec-tag)' },
  outro:        { label:'Outro',        abbr:'O',  color:'var(--sec-outro)' },
};

function sectionMeta(section){
  const meta = TYPE_META[section.type] || TYPE_META.verse;
  const label = section.n ? `${meta.label} ${section.n}` : meta.label;
  const abbr  = section.n ? `${meta.abbr}${section.n}` : meta.abbr;
  return { label, abbr, color: meta.color };
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// Flags each section that has identical content (lyrics + chords, ignoring
// production notes) to an earlier section, so minimal view can collapse it
// to a one-line "repeat" reference instead of reprinting it.
function computeRepeats(sections){
  const seen = [];
  return sections.map((sec, idx)=>{
    const sig = JSON.stringify({
      type: sec.type, n: sec.n || null,
      lines: sec.lines || null,
      chordLine: sec.chordLine || null,
      chordLine2: sec.chordLine2 || null,
    });
    const match = seen.find(s => s.sig === sig);
    if(match){
      return { isRepeat:true, ofLabel: match.label };
    }
    seen.push({ sig, label: sectionMeta(sec).label });
    return { isRepeat:false };
  });
}

function renderSongList(){
  const ul = document.getElementById('songList');
  ul.innerHTML = SONGS.map((song, i) => {
    const key = song.pending ? null : (state.keyBySong[song.id] || song.originalKey);
    const active = song.id === state.currentId;
    return `<li class="song-item ${active?'active':''} ${song.pending?'pending':''}" data-id="${song.id}">
      <span class="song-num">${i+1}</span>
      <span class="song-meta">
        <div class="song-title">${esc(song.title)}</div>
        <div class="song-artist">${esc(song.artist)}</div>
      </span>
      <span class="song-key-pill ${key?'':'empty'}">${key || '—'}</span>
    </li>`;
  }).join('');
  ul.querySelectorAll('.song-item').forEach(el=>{
    el.addEventListener('click', ()=>{ state.currentId = el.dataset.id; renderAll(); });
  });
}

function renderChunk(chunk, steps, useFlats){
  const chord = transposeLabel(chunk.c, steps, useFlats);
  return `<span class="chunk"><span class="chord">${esc(chord)}</span><span class="lyric">${esc(chunk.l) || '&nbsp;'}</span></span>`;
}

function renderSection(section, idx, steps, useFlats, repeatInfo, focused){
  const meta = sectionMeta(section);
  const anchorId = `sec-${idx}`;
  const chordOnly = !section.lines && (section.chordLine || section.chordLine2) ? ' chord-only' : '';
  const focusedCls = focused ? ' focused' : '';

  const handle = `<span class="drag-handle" draggable="true" data-idx="${idx}" title="Drag to reorder">
    <svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2" r="1.4"/><circle cx="7.5" cy="2" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="14" r="1.4"/><circle cx="7.5" cy="14" r="1.4"/></svg>
  </span>`;

  if(repeatInfo && repeatInfo.isRepeat){
    return `<div class="section-card compact${chordOnly}${focusedCls}" id="${anchorId}" data-idx="${idx}" style="--badge-color:${meta.color}">
      <div class="section-card-head">
        ${handle}
        <span class="badge">${meta.abbr}</span>
        <span class="section-label">${meta.label}</span>
        <span class="repeat-tag">repeat &middot; same as ${esc(repeatInfo.ofLabel)}</span>
        <span class="head-right">
          ${section.note ? `<span class="section-note">${esc(section.note)}</span>` : ''}
          <button class="section-close" data-idx="${idx}" title="Remove this section">&times;</button>
        </span>
      </div>
    </div>`;
  }

  let body = '';
  if(section.chordLine){
    body += `<div class="chord-line">${section.chordLine.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
  }
  if(section.chordLine2){
    body += `<div class="chord-line" style="margin-top:8px;">${section.chordLine2.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
  }
  if(section.lines){
    body += section.lines.map(line=>`<div class="lyric-line">${line.map(ch=>renderChunk(ch, steps, useFlats)).join('')}</div>`).join('');
  }
  return `<div class="section-card${chordOnly}${focusedCls}" id="${anchorId}" data-idx="${idx}" style="--badge-color:${meta.color}">
    <div class="section-card-head">
      ${handle}
      <span class="badge">${meta.abbr}</span>
      <span class="section-label">${meta.label}</span>
      <span class="head-right">
        ${section.note ? `<span class="section-note">${esc(section.note)}</span>` : ''}
        <button class="section-close" data-idx="${idx}" title="Remove this section">&times;</button>
      </span>
    </div>
    ${body}
  </div>`;
}

function renderMain(){
  const song = SONGS.find(s=>s.id===state.currentId);
  const main = document.getElementById('main');
  const appEl = document.querySelector('.app');
  if(appEl) appEl.classList.toggle('focus-active', !!(state.focusMode && !song.pending));

  if(song.pending){
    main.innerHTML = `
      <div class="chart-header">
        <div><h2>${esc(song.title)}</h2><p class="artist">${esc(song.artist)}</p></div>
      </div>
      <div class="empty-state">
        <h3>Chart not added yet</h3>
        <p>Send over the lyrics and chords for this one &mdash; chords placed above the words they land on works great, or a chord chart PDF is even easier to drop in accurately.</p>
        <p>Once it's in, it'll get the same layout and key-changer as <code>10,000 Reasons</code>.</p>
      </div>`;
    return;
  }

  const originalKey = song.originalKey;
  const currentKey = state.keyBySong[song.id] || originalKey;
  const steps = stepsBetween(originalKey, currentKey);
  const useFlats = FLAT_KEYS.has(currentKey);

  const repeats = computeRepeats(song.sections);
  const removedStack = state.removedBySong[song.id] || [];
  const order = getOrder(song);
  const visibleIdx = order.filter(i=>!removedStack.includes(i));

  if(state.focusMode){
    renderFocusView(song, steps, useFlats);
    return;
  }

  const keyOptions = ALL_KEYS.map(k=>`<option value="${k}" ${k===currentKey?'selected':''}>${k}</option>`).join('');
  const nav = visibleIdx.map(idx=>{
    const sec = song.sections[idx];
    const meta = sectionMeta(sec);
    const chordOnly = !sec.lines && (sec.chordLine || sec.chordLine2) ? ' chord-only' : '';
    return `<span class="nav-pill${chordOnly}" style="--pill-color:${meta.color}" data-target="sec-${idx}">
      <span class="nav-dot">${meta.abbr}</span>${meta.label}
    </span>`;
  }).join('');

  main.innerHTML = `
    <div class="chart-header">
      <div>
        <h2>${esc(song.title)}</h2>
        <p class="artist">${esc(song.artist)}</p>
      </div>
      <div class="meta-row">
        <span class="meta-tag">${song.tempo} BPM</span>
        <span class="meta-tag">${song.time}</span>
        <span class="meta-tag print-only">Key: ${currentKey}</span>
        <div class="view-toggle">
          <button class="toggle-btn ${state.viewMode==='full'?'active':''}" data-mode="full">Full</button>
          <button class="toggle-btn ${state.viewMode==='minimal'?'active':''}" data-mode="minimal">Minimal</button>
          <button class="toggle-btn ${state.viewMode==='lyrics'?'active':''}" data-mode="lyrics">Lyrics</button>
        </div>
        ${removedStack.length ? `<button class="pdf-btn" id="undoBtn" title="Bring back the last removed section">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h8a4 4 0 0 1 0 8H9"/><path d="M7 4.5 3.5 8 7 11.5"/></svg>
          Undo remove
        </button>` : ''}
        <div class="key-control">
          <label>Key</label>
          <button class="step-btn" id="keyDown">&minus;</button>
          <select id="keySelect">${keyOptions}</select>
          <button class="step-btn" id="keyUp">&plus;</button>
          ${currentKey!==originalKey ? `<button class="reset-link" id="keyReset">reset to ${originalKey}</button>` : ''}
        </div>
        <button class="pdf-btn" id="pdfBtn" title="Save just this chart as a PDF">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 2.5h7l3 3v12a.5.5 0 0 1-.5.5h-9.5a.5.5 0 0 1-.5-.5v-14a.5.5 0 0 1 .5-.5Z"/><path d="M12 2.5V6h3"/><path d="M7 14h6M7 11h6"/></svg>
          Save as PDF
        </button>
        <button class="pdf-btn" id="presentBtn" title="Open lyric slides in a separate window you can drag to a second display">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="16" height="10.5" rx="1.2"/><path d="M7.5 17.5h5M10 14.5v3"/></svg>
          Present
        </button>
      </div>
    </div>
    <div class="section-nav${state.viewMode==='lyrics' ? ' hide-chords' : ''}">${nav}</div>
    <div class="chart-grid${state.viewMode==='lyrics' ? ' hide-chords' : ''}">
      ${visibleIdx.map(idx=>renderSection(song.sections[idx], idx, steps, useFlats, state.viewMode==='minimal' ? repeats[idx] : null)).join('')}
    </div>
  `;

  main.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.viewMode = btn.dataset.mode; renderAll(); });
  });
  main.querySelectorAll('.section-close').forEach(btn=>{
    btn.addEventListener('click', ()=> removeSection(song.id, parseInt(btn.dataset.idx, 10)));
  });

  main.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('dragstart', e=>{
      dragSourceIdx = parseInt(handle.dataset.idx, 10);
      const card = handle.closest('.section-card');
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setDragImage(card, 20, 20);
      try{ e.dataTransfer.setData('text/plain', String(dragSourceIdx)); }catch(err){}
    });
    handle.addEventListener('dragend', ()=>{
      main.querySelectorAll('.section-card').forEach(c=>c.classList.remove('dragging','drag-over-top','drag-over-bottom'));
      dragSourceIdx = null;
    });
  });
  main.querySelectorAll('.section-card').forEach(card=>{
    card.addEventListener('dragover', e=>{
      if(dragSourceIdx===null) return;
      e.preventDefault();
      const targetIdx = parseInt(card.dataset.idx, 10);
      if(targetIdx===dragSourceIdx) return;
      const rect = card.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height/2;
      card.classList.toggle('drag-over-top', !after);
      card.classList.toggle('drag-over-bottom', after);
    });
    card.addEventListener('dragleave', ()=>{
      card.classList.remove('drag-over-top','drag-over-bottom');
    });
    card.addEventListener('drop', e=>{
      e.preventDefault();
      const targetIdx = parseInt(card.dataset.idx, 10);
      const after = card.classList.contains('drag-over-bottom');
      card.classList.remove('drag-over-top','drag-over-bottom');
      if(dragSourceIdx===null || targetIdx===dragSourceIdx) return;
      reorderSection(song, dragSourceIdx, targetIdx, after);
    });
  });
  const undoBtn = document.getElementById('undoBtn');
  if(undoBtn) undoBtn.addEventListener('click', ()=> undoRemove(song.id));
  document.getElementById('pdfBtn').addEventListener('click', ()=>{
    const originalTitle = document.title;
    document.title = `${song.title} (${currentKey})`;
    const restore = ()=>{ document.title = originalTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 3000); // fallback for browsers that skip afterprint on "Save as PDF"
  });
  document.getElementById('presentBtn').addEventListener('click', ()=> enterFocusMode(song));
  document.getElementById('keySelect').addEventListener('change', e=>{
    state.keyBySong[song.id] = e.target.value; renderAll();
  });
  document.getElementById('keyUp').addEventListener('click', ()=>{
    const i = ALL_KEYS.indexOf(currentKey);
    state.keyBySong[song.id] = ALL_KEYS[(i+1)%ALL_KEYS.length]; renderAll();
  });
  document.getElementById('keyDown').addEventListener('click', ()=>{
    const i = ALL_KEYS.indexOf(currentKey);
    state.keyBySong[song.id] = ALL_KEYS[(i-1+ALL_KEYS.length)%ALL_KEYS.length]; renderAll();
  });
  const resetBtn = document.getElementById('keyReset');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    delete state.keyBySong[song.id]; renderAll();
  });
  main.querySelectorAll('.nav-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.getElementById(el.dataset.target).scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// Distraction-free chart view used while presenting: hides everything but
// the section cards, highlights + auto-scrolls to the section in focus, and
// (via syncPresentToFocus) mirrors that section to the projector window.
// A section too long for one projected slide gets rendered here as its own
// chart card per part — same chunk-splitting boundaries as buildSlideGroups
// uses for the projector, so what's on screen always matches what the chart
// shows. Chord summary lines (chordLine/chordLine2) only repeat on part 1.
function renderFocusPartialCard(section, sectionIdx, steps, useFlats, position, focused){
  const meta = sectionMeta(section);
  const focusedCls = focused ? ' focused' : '';
  const partSuffix = position.parts > 1
    ? ` <span class="section-part">(${position.part}/${position.parts})</span>`
    : '';

  let body = '';
  if(position.part === 1){
    if(section.chordLine){
      body += `<div class="chord-line">${section.chordLine.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
    }
    if(section.chordLine2){
      body += `<div class="chord-line" style="margin-top:8px;">${section.chordLine2.map(c=>`<span class="chord-pill">${esc(transposeLabel(c, steps, useFlats))}</span>`).join('')}</div>`;
    }
  }
  const [start, end] = position.range;
  body += section.lines.slice(start, end)
    .map(line=>`<div class="lyric-line">${line.map(ch=>renderChunk(ch, steps, useFlats)).join('')}</div>`)
    .join('');

  return `<div class="section-card${focusedCls}" id="sec-${sectionIdx}-p${position.part}" style="--badge-color:${meta.color}">
    <div class="section-card-head">
      <span class="badge">${meta.abbr}</span>
      <span class="section-label">${meta.label}${partSuffix}</span>
    </div>
    ${body}
  </div>`;
}

function renderFocusView(song, steps, useFlats){
  const main = document.getElementById('main');
  const groups = buildSlideGroups(song);
  const positions = flattenFocusPositions(groups);

  if(!positions.length){
    main.innerHTML = `
      <div class="focus-bar">
        <button class="focus-exit" id="focusExit">&times; Exit Focus</button>
        <div class="focus-title">${esc(song.title)}</div>
        <div class="focus-counter"></div>
      </div>
      <div class="empty-state"><h3>Nothing to focus on</h3><p>Every section has been removed from this chart.</p></div>`;
    document.getElementById('focusExit').addEventListener('click', exitFocusMode);
    return;
  }

  state.focusPos = Math.max(0, Math.min(positions.length - 1, state.focusPos));

  const cards = positions.map((pos, i)=>{
    const focused = i === state.focusPos;
    const section = song.sections[pos.sectionIdx];
    return pos.range === null
      ? renderSection(section, pos.sectionIdx, steps, useFlats, null, focused)
      : renderFocusPartialCard(section, pos.sectionIdx, steps, useFlats, pos, focused);
  }).join('');

  main.innerHTML = `
    <div class="focus-bar">
      <button class="focus-exit" id="focusExit" title="Exit focus mode (Esc)">&times; Exit Focus</button>
      <div class="focus-title">${esc(song.title)}</div>
      <div class="focus-counter">${state.focusPos + 1} / ${positions.length}</div>
    </div>
    <div class="chart-grid focus-mode-grid${state.viewMode==='lyrics' ? ' hide-chords' : ''}" id="focusGrid">${cards}</div>
    <div class="focus-nav">
      <button class="focus-nav-btn" id="focusUp" title="Previous section (↑)" ${state.focusPos===0 ? 'disabled' : ''}>&uarr;</button>
      <button class="focus-nav-btn" id="focusDown" title="Next section (↓)" ${state.focusPos===positions.length-1 ? 'disabled' : ''}>&darr;</button>
    </div>
  `;

  document.getElementById('focusExit').addEventListener('click', exitFocusMode);
  document.getElementById('focusUp').addEventListener('click', ()=> focusMove(-1));
  document.getElementById('focusDown').addEventListener('click', ()=> focusMove(1));

  const focusedCard = main.querySelector('.section-card.focused');
  if(focusedCard && typeof focusedCard.scrollIntoView === 'function'){
    try{ focusedCard.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
  }

  syncPresentToFocus(song);
}

function renderAll(){
  renderSongList();
  renderMain();
}

/* ======================= PROJECTION SLIDES ======================= */

const MAX_LINES_PER_SLIDE = 4;
const slideState = { slides: [], index: 0 };

// Joins a line's chunks into plain lyric text for projection (no chords).
// A chunk ending in a bare hyphen (e.g. "eve-") is a mid-word split and
// gets glued to the next chunk with no space; "hal - le -" style spelled
// syllables (hyphen preceded by a space) join normally with a space.
function joinLineText(line){
  let out = '';
  for(const ch of line){
    const t = ch.l || '';
    if(!t) continue;
    if(/[^\s]-$/.test(out)){
      out = out.slice(0, -1) + t;
    } else if(out){
      out += ' ' + t;
    } else {
      out = t;
    }
  }
  return out;
}

// Builds one slide-group per *visible* section (custom order + removed
// sections applied), ignoring Minimal/Lyrics view settings — a live
// projection needs every repeat shown, chords stripped. A section with no
// lyrics (an intro, an instrumental break) still gets one blank slide so
// there's always exactly one group per section — that 1:1 mapping is what
// lets chart-focus navigation and the projector stay in lockstep.
// Splits `total` lines into the fewest slides that each hold at most
// `maxPerSlide`, but — unlike a greedy fill — spreads the remainder across
// the early slides so no split leaves a lopsided, mostly-empty last slide
// (10 lines / max 4 => [4,3,3], not [4,4,2]).
function computeSplitRanges(total, maxPerSlide){
  if(total <= 0) return [[0, 0]];
  if(total <= maxPerSlide) return [[0, total]];
  const numSlides = Math.ceil(total / maxPerSlide);
  const base = Math.floor(total / numSlides);
  const remainder = total % numSlides;
  const ranges = [];
  let start = 0;
  for(let i=0; i<numSlides; i++){
    const size = base + (i < remainder ? 1 : 0);
    ranges.push([start, start + size]);
    start += size;
  }
  return ranges;
}

// Builds one slide-group per *visible* section (custom order + removed
// sections applied), ignoring Minimal/Lyrics view settings — a live
// projection needs every repeat shown, chords stripped. A section with no
// lyrics (an intro, an instrumental break) still gets one blank slide, and a
// section too long for one slide splits into evenly-sized parts — either
// way every slide traces back to exactly one group. That 1:1 mapping (via
// flattenFocusPositions) is what lets chart-focus navigation and the
// projector step through the same sequence in lockstep.
function buildSlideGroups(song){
  const removedStack = state.removedBySong[song.id] || [];
  const order = getOrder(song);
  const visible = order.filter(i => !removedStack.includes(i));
  const groups = [];
  let cursor = 0;
  visible.forEach(idx=>{
    const sec = song.sections[idx];
    const label = sectionMeta(sec).label;
    const totalLines = sec.lines ? sec.lines.length : 0;

    if(!totalLines){
      groups.push({ sectionIdx: idx, label, startIndex: cursor, count: 1, ranges: null, slides: [{ label, lines: [] }] });
      cursor += 1;
      return;
    }

    const ranges = computeSplitRanges(totalLines, MAX_LINES_PER_SLIDE);
    const slides = ranges.map(([start, end], i)=>{
      const textLines = sec.lines.slice(start, end).map(joinLineText).filter(Boolean);
      const partLabel = ranges.length > 1 ? `${label} (${i+1}/${ranges.length})` : label;
      return { label: partLabel, lines: textLines };
    });
    groups.push({ sectionIdx: idx, label, startIndex: cursor, count: slides.length, ranges, slides });
    cursor += slides.length;
  });
  return groups;
}

function buildSlides(song){
  return buildSlideGroups(song).reduce((acc, g)=> acc.concat(g.slides), []);
}

// Flattens slide-groups into one entry per actual slide — the same order
// and length as buildSlides()'s output — so state.focusPos can index this
// array directly and always mean "the same slide the projector is showing."
function flattenFocusPositions(groups){
  const positions = [];
  groups.forEach(g=>{
    if(!g.ranges){
      positions.push({ sectionIdx: g.sectionIdx, label: g.label, range: null, part: 1, parts: 1 });
    } else {
      g.ranges.forEach((range, i)=>{
        positions.push({ sectionIdx: g.sectionIdx, label: g.label, range, part: i + 1, parts: g.ranges.length });
      });
    }
  });
  return positions;
}

function renderSlide(){
  const { slides, index } = slideState;
  const labelEl = document.getElementById('slideLabel');
  const textEl = document.getElementById('slideText');
  const counterEl = document.getElementById('slideCounter');
  if(!slides.length){
    labelEl.textContent = '';
    textEl.textContent = "No lyrics to project for this song yet.";
    counterEl.textContent = '';
    return;
  }
  const s = slides[index];
  labelEl.textContent = s.label;
  textEl.innerHTML = s.lines.map(esc).join('<br>');
  counterEl.textContent = `${index + 1} / ${slides.length}`;
}

function slideNext(){ if(slideState.index < slideState.slides.length - 1){ slideState.index++; renderSlide(); } }
function slidePrev(){ if(slideState.index > 0){ slideState.index--; renderSlide(); } }

function onSlideKeydown(e){
  if(e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' '){ e.preventDefault(); slideNext(); }
  else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); slidePrev(); }
  else if(e.key==='Escape'){ closeSlides(); }
}

function openSlides(song){
  slideState.slides = buildSlides(song);
  slideState.index = 0;
  renderSlide();
  document.getElementById('slidesOverlay').hidden = false;
  document.addEventListener('keydown', onSlideKeydown);
}
function closeSlides(){
  document.getElementById('slidesOverlay').hidden = true;
  document.removeEventListener('keydown', onSlideKeydown);
}

/* ---- Separate-window presentation (draggable to a second display) ---- */
// A plain in-page overlay can never leave the browser tab, so true "drag
// this onto my second monitor" needs a real OS-level window: window.open()
// gives the operator something with its own title bar they can drag to
// another display and fullscreen there, independent of this tab.

let presentWin = null;
let presentPollTimer = null;

function buildPresentHTML(songTitle, slides){
  const json = JSON.stringify(slides).replace(/</g, '\\u003c');
  return `<!doctype html>
<title>Presenting: ${songTitle.replace(/</g,'&lt;')}</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#0a0a0a; color:#f5f3ec; font-family:Georgia,'Times New Roman',serif;}
  body{display:flex; align-items:center; justify-content:center; flex-direction:column; padding:8vh 9vw; text-align:center; user-select:none; touch-action:none; overflow:hidden;}
  .p-label{position:fixed; top:22px; left:28px; font-family:monospace; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:rgba(245,243,236,.4);}
  .p-text{font-weight:600; font-size:clamp(1.8rem, 5vw, 4.2rem); line-height:1.35; max-width:100%;}
  .p-counter{position:fixed; bottom:22px; right:28px; font-family:monospace; font-size:.75rem; color:rgba(245,243,236,.4);}
  .p-nav{position:fixed; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; background:rgba(245,243,236,.08); color:#f5f3ec; font-size:1.7rem; display:flex; align-items:center; justify-content:center;}
  .p-nav:hover{background:rgba(245,243,236,.18);}
  .p-prev{left:18px;} .p-next{right:18px;}
  .p-fs{position:fixed; top:18px; right:22px; background:none; border:none; cursor:pointer; color:rgba(245,243,236,.55); font-size:.85rem; font-family:monospace; padding:6px;}
  .p-fs:hover{color:#f5f3ec;}
</style>
<div class="p-label" id="label"></div>
<div class="p-text" id="text"></div>
<div class="p-counter" id="counter"></div>
<button class="p-nav p-prev" id="prev" aria-label="Previous">&lsaquo;</button>
<button class="p-nav p-next" id="next" aria-label="Next">&rsaquo;</button>
<button class="p-fs" id="fs">Fullscreen (F)</button>
<script>
  var SLIDES = ${json};
  var i = 0;
  function render(){
    var labelEl = document.getElementById('label');
    var textEl = document.getElementById('text');
    var counterEl = document.getElementById('counter');
    if(!SLIDES.length){
      textEl.textContent = 'No lyrics to project for this song yet.';
      labelEl.textContent = ''; counterEl.textContent = '';
      return;
    }
    var s = SLIDES[i];
    labelEl.textContent = s.label;
    textEl.innerHTML = s.lines.map(function(l){
      var d = document.createElement('div'); d.textContent = l; return d.innerHTML;
    }).join('<br>');
    counterEl.textContent = (i + 1) + ' / ' + SLIDES.length;
    if(window.opener){ try{ window.opener.postMessage({type:'worship-present-state', index:i, total:SLIDES.length}, '*'); }catch(e){} }
  }
  function next(){ if(i < SLIDES.length - 1){ i++; render(); } }
  function prev(){ if(i > 0){ i--; render(); } }
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('fs').addEventListener('click', function(){
    try{
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else{ document.documentElement.requestFullscreen(); }
    }catch(e){}
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' '){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='f' || e.key==='F'){ document.getElementById('fs').click(); }
  });
  var sx = null, sy = null;
  document.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(sx===null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){ if(dx < 0) next(); else prev(); }
  }, {passive:true});
  window.addEventListener('message', function(e){
    if(!e.data) return;
    if(e.data.type==='worship-present-nav'){
      if(e.data.dir==='next') next();
      else if(e.data.dir==='prev') prev();
    } else if(e.data.type==='worship-present-goto'){
      var idx = e.data.index;
      if(typeof idx === 'number' && idx >= 0 && idx < SLIDES.length && idx !== i){ i = idx; render(); }
    }
  });
  render();
<\/script>`;
}

function showPresentBar(total){
  document.getElementById('presentBar').hidden = false;
  document.getElementById('presentBarCounter').textContent = `1 / ${total}`;
}
function hidePresentBar(){
  document.getElementById('presentBar').hidden = true;
}

function openPresentWindow(song){
  const slides = buildSlides(song);
  if(presentPollTimer){ clearInterval(presentPollTimer); presentPollTimer = null; }
  const w = window.open('', 'worshipPresentDisplay', 'width=1000,height=700,resizable=yes,menubar=no,toolbar=no,location=no,status=no');
  if(!w){
    // Popup blocked — fall back to the in-tab overlay so Present still works.
    openSlides(song);
    return;
  }
  presentWin = w;
  presentWin.document.open();
  presentWin.document.write(buildPresentHTML(song.title, slides));
  presentWin.document.close();
  try{ presentWin.focus(); }catch(e){}
  showPresentBar(slides.length);
  presentPollTimer = setInterval(()=>{
    if(!presentWin || presentWin.closed){
      hidePresentBar();
      if(presentPollTimer){ clearInterval(presentPollTimer); presentPollTimer = null; }
      presentWin = null;
      if(state.focusMode) exitFocusMode();
    }
  }, 800);
}

/* ---- Chart focus mode: navigate sections on the chart, mirrored live to the projector ---- */

function onFocusKeydown(e){
  if(!state.focusMode) return;
  // Focus mode owns arrow/space/escape while active — stop the fallback
  // slides-overlay's own keydown handler (bound to the same document) from
  // also reacting and fighting over the same slide index.
  e.stopImmediatePropagation();
  if(e.key==='ArrowDown' || e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); focusMove(1); }
  else if(e.key==='ArrowUp' || e.key==='ArrowLeft'){ e.preventDefault(); focusMove(-1); }
  else if(e.key==='Escape'){ exitFocusMode(); }
}

function enterFocusMode(song){
  state.focusMode = true;
  state.focusPos = 0;
  document.addEventListener('keydown', onFocusKeydown);
  openPresentWindow(song);
  renderAll();
}

function exitFocusMode(){
  state.focusMode = false;
  document.removeEventListener('keydown', onFocusKeydown);
  renderAll();
}

function focusMove(delta){
  const song = SONGS.find(s=>s.id===state.currentId);
  if(!song || song.pending) return;
  const positions = flattenFocusPositions(buildSlideGroups(song));
  if(!positions.length) return;
  state.focusPos = Math.max(0, Math.min(positions.length - 1, state.focusPos + delta));
  renderAll();
}

// Tells the projector (popup, or the in-tab fallback overlay) to jump to the
// slide in focus. state.focusPos now indexes the same flattened slide list
// buildSlides() produces, so no section-to-slide lookup is needed — the
// chart position IS the slide index.
function syncPresentToFocus(song){
  if(!state.focusMode) return;
  if(presentWin && !presentWin.closed){
    try{ presentWin.postMessage({type:'worship-present-goto', index: state.focusPos}, '*'); }catch(e){}
  } else if(!document.getElementById('slidesOverlay').hidden){
    slideState.slides = buildSlides(song);
    slideState.index = state.focusPos;
    renderSlide();
  }
}

// Vertical swipe on the chart itself moves focus by one section (up = prior,
// down = next) — same gesture direction as the existing slide-swipe.
let focusTouchStartX = null, focusTouchStartY = null;
document.addEventListener('touchstart', e=>{
  if(!state.focusMode) return;
  const t = e.changedTouches[0];
  focusTouchStartX = t.clientX; focusTouchStartY = t.clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(!state.focusMode || focusTouchStartX===null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - focusTouchStartX;
  const dy = t.clientY - focusTouchStartY;
  focusTouchStartX = null;
  if(Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) * 1.5){
    if(dy < 0) focusMove(1); else focusMove(-1);
  }
}, {passive:true});

(function initSlidesOverlay(){
  const overlay = document.getElementById('slidesOverlay');
  document.getElementById('slideNext').addEventListener('click', slideNext);
  document.getElementById('slidePrev').addEventListener('click', slidePrev);
  document.getElementById('slideClose').addEventListener('click', closeSlides);
  document.getElementById('presentBarPrev').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.postMessage({type:'worship-present-nav', dir:'prev'}, '*');
  });
  document.getElementById('presentBarNext').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.postMessage({type:'worship-present-nav', dir:'next'}, '*');
  });
  document.getElementById('presentBarClose').addEventListener('click', ()=>{
    if(presentWin && !presentWin.closed) presentWin.close();
    hidePresentBar();
    if(state.focusMode) exitFocusMode();
  });
  window.addEventListener('message', e=>{
    if(e.data && e.data.type==='worship-present-state'){
      document.getElementById('presentBarCounter').textContent = `${e.data.index + 1} / ${e.data.total}`;
      // Mirror the projector's own navigation (its arrow keys/swipe) back onto
      // the chart — focusPos and the projector's slide index are the same
      // number now, so this is a direct assignment, not a lookup.
      if(state.focusMode && e.data.index !== state.focusPos){
        const song = SONGS.find(s=>s.id===state.currentId);
        if(song && !song.pending){
          state.focusPos = e.data.index;
          renderAll();
        }
      }
    }
  });
  let touchStartX = null, touchStartY = null;
  overlay.addEventListener('touchstart', e=>{
    if(state.focusMode) return; // chart focus mode owns swipe navigation instead
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  overlay.addEventListener('touchend', e=>{
    if(state.focusMode || touchStartX===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) slideNext(); else slidePrev();
    }
  }, {passive:true});
})();

(function initLayoutToggle(){
  const wrap = document.getElementById('layoutToggle');
  if(!wrap) return;
  wrap.addEventListener('click', e=>{
    const btn = e.target.closest('.layout-btn');
    if(!btn) return;
    state.layout = btn.dataset.layout;
    applyLayout();
  });
})();

function applyLayout(){
  const app = document.querySelector('.app');
  if(app) app.classList.toggle('layout-1col', state.layout === '1col');
  document.querySelectorAll('#layoutToggle .layout-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.layout === state.layout);
  });
}

applyLayout();
renderAll();
</script>
